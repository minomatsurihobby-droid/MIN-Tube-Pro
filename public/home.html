function wireSettingsHandlers(){
  if(!_stRoot) return;
  const c = _stRoot.querySelector('#stContent');

  // Toggles
  c.querySelectorAll('[data-toggle]').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      const k = sw.dataset.toggle;
      SETTINGS[k] = !SETTINGS[k];
      saveSettings(); applySettings();
      sw.classList.toggle('on', SETTINGS[k]);
    });
  });

  // Username
  const userEl = c.querySelector('#stUser');
  if(userEl){
    userEl.addEventListener('input', e=>{
      SETTINGS.username = e.target.value;
      saveSettings();
    });
  }
  // Brightness
  const briEl = c.querySelector('#stBri');
  if(briEl){
    briEl.addEventListener('input', e=>{
      SETTINGS.brightness = +e.target.value;
      c.querySelector('#stBriV').textContent = SETTINGS.brightness + '%';
      saveSettings(); applySettings();
    });
  }
  // Accent swatches
  c.querySelectorAll('#stSwatch .st-sw').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      SETTINGS.accent = sw.dataset.c;
      c.querySelectorAll('#stSwatch .st-sw').forEach(x=>x.classList.remove('active'));
      sw.classList.add('active');
      saveSettings(); applySettings();
    });
  });
  // Theme
  const themeEl = c.querySelector('#stTheme');
  if(themeEl){
    themeEl.addEventListener('change', e=>{
      SETTINGS.theme = e.target.value;
      saveSettings(); applySettings();
    });
  }
  // Wallpaper picker
  c.querySelectorAll('#stWpGrid .st-wp-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.wp;
      SETTINGS.wallpaper = id;
      c.querySelectorAll('#stWpGrid .st-wp-item').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      saveSettings(); applySettings();
      const w = WALLPAPERS.find(x=>x.id===id);
      notify(`壁紙を「${w ? w.name : 'デフォルト'}」に変更しました`);
    });
  });
  // Fullscreen
  c.querySelector('#stFsBtn')?.addEventListener('click', ()=>{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
  // Dock pin
  c.querySelector('#stDockPin')?.addEventListener('click', ()=>{
    document.body.classList.toggle('dock-pinned');
    renderSettingsContent();
  });
  // Clear storage
  c.querySelector('#stClear')?.addEventListener('click', ()=>{
    if(confirm('全てのローカルデータをクリアします。よろしいですか？')){
      try{ localStorage.removeItem(SETTINGS_KEY); localStorage.removeItem(HOME_KEY); }catch{}
      location.reload();
    }
  });
  // Home page list
  const list = c.querySelector('#stHomeList');
  if(list){
    let h = '';
    HOME_APPS.forEach(id=>{
      const a = getApp(id); if(!a) return;
      h += `
        <div class="st-row" style="gap:14px">
          <div style="width:36px;height:36px;border-radius:9px;overflow:hidden;flex-shrink:0">${renderIcon(a)}</div>
          <div class="rinfo"><div class="rname">${escapeHtml(a.name)}</div><div class="rdesc">${escapeHtml(a.desc||'')}</div></div>
          <div class="rctrl">
            <button class="st-btn" data-act="open" data-id="${a.id}">開く</button>
            ${a.locked ? '' : `<button class="st-btn danger" data-act="rm" data-id="${a.id}">削除</button>`}
          </div>
        </div>
      `;
    });
    if(!h) h = `<div style="padding:20px;color:var(--text-mute);font-size:13px;text-align:center">ホーム画面にアプリがありません</div>`;
    list.innerHTML = h;
    list.querySelectorAll('button[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.id;
        if(btn.dataset.act==='open') WM.open(getApp(id));
        else if(btn.dataset.act==='rm'){
          if(uninstallApp(id)){
            notify(`${getApp(id)?.name||''} を削除しました`);
            renderSettingsContent();
          }
        }
      });
    });
  }
  c.querySelector('#stOpenStore')?.addEventListener('click', ()=> WM.open(getApp('appstore')));
  c.querySelector('#stResetHome')?.addEventListener('click', ()=>{
    if(confirm('ホーム画面を初期状態に戻します。よろしいですか？')){
      HOME_APPS = DEFAULT_HOME.slice();
      saveHome(HOME_APPS); buildDesktop(); buildDock();
      notify('ホーム画面をリセットしました');
      renderSettingsContent();
    }
  });
}

/* =========================================================
   Clock
   ========================================================= */
function tickClock(){
  const d = new Date();
  const wk = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const t = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  document.getElementById('clk').textContent = `${wk} ${d.getMonth()+1}/${d.getDate()} ${t}`;
}
setInterval(tickClock,1000); tickClock();

/* =========================================================
   Boot Sequence
   ========================================================= */
window.addEventListener('load', ()=>{
  applySettings();
  buildDesktop();
  buildDock();
  if(!SETTINGS.bootAnim){
    document.getElementById('boot').classList.add('hidden');
    setTimeout(()=> notify('Welcome to NyxOS ✦'), 500);
  }else{
    /* Boot animation timeline (total ~3.1s for an impactful but quick intro):
       - 0.25s–1.3s : crescent stroke draws in
       - 1.15s–1.7s : crescent fills white + outer ring fades in
       - 1.35s–2.05s: star pops with particle burst
       - 1.65s–2.5s : "N Y X O S" wordmark fades up
       - 2.5s–3.1s  : intentional cinematic pause so it lingers in memory
       - 3.1s        : splash fades out */
    setTimeout(()=> document.getElementById('boot').classList.add('hidden'), 3100);
    setTimeout(()=> notify('Welcome to NyxOS ✦'), 3900);
  }
});

/* =========================================================
   Desktop right-click → quick App Store access
   ========================================================= */
document.getElementById('desktop').addEventListener('contextmenu', e=>{
  if(e.target.id==='desktop'){
    e.preventDefault();
    const m = document.createElement('div');
    m.className='ctx-menu'; m.id='ctxMenu';
    m.style.left=e.clientX+'px'; m.style.top=e.clientY+'px';
    m.innerHTML = `
      <div class="ctx-item" data-act="store">🛍 App Store を開く</div>
      <div class="ctx-item" data-act="reset">🔄 ホーム画面をリセット</div>
    `;
    document.body.appendChild(m);
    m.querySelector('[data-act=store]').addEventListener('click', ()=>{
      closeCtxMenu(); WM.open(getApp('appstore'));
    });
    m.querySelector('[data-act=reset]').addEventListener('click', ()=>{
      if(confirm('ホーム画面をデフォルトに戻しますか?')){
        HOME_APPS = DEFAULT_HOME.slice();
        saveHome(HOME_APPS); buildDesktop(); buildDock();
        notify('ホーム画面をリセットしました');
      }
      closeCtxMenu();
    });
  }
});

/* =========================================================
   Keyboard shortcuts
   ========================================================= */
document.addEventListener('keydown', e=>{
  // Cmd/Ctrl + W → close focused window
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='w'){
    const f = document.querySelector('.window.focused');
    if(f){ e.preventDefault(); WM.close(f); }
  }
  // Cmd/Ctrl + M → minimize focused
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='m'){
    const f = document.querySelector('.window.focused');
    if(f){ e.preventDefault(); WM.minimize(f); }
  }
  // Cmd/Ctrl + D → toggle dock pinned
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='d'){
    e.preventDefault();
    document.body.classList.toggle('dock-pinned');
    notify(document.body.classList.contains('dock-pinned') ? 'Dock を固定しました' : 'Dock の固定を解除しました');
  }
  // F11 → toggle fullscreen API
  if(e.key === 'F11'){
    e.preventDefault();
    toggleFullscreen();
  }
  // Esc closes context menu
  if(e.key==='Escape') closeCtxMenu();
});

/* =========================================================
   Fullscreen Toggle — menubar button + Fullscreen API
   ========================================================= */
function toggleFullscreen(){
  const d = document;
  const el = d.documentElement;
  const isFs = d.fullscreenElement || d.webkitFullscreenElement || d.mozFullScreenElement || d.msFullscreenElement;
  try{
    if(!isFs){
      (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
    }else{
      (d.exitFullscreen || d.webkitExitFullscreen || d.mozCancelFullScreen || d.msExitFullscreen).call(d);
    }
  }catch(err){
    // iOS Safari often blocks fullscreen on documentElement — fall back
    // to a "chromeless" CSS mode for a similar visual experience.
    document.body.classList.toggle('is-fullscreen');
    document.body.classList.toggle('faux-fullscreen');
    notify(document.body.classList.contains('faux-fullscreen') ? '大画面モード (シミュレート)' : '小画面モード');
  }
}
function syncFullscreenState(){
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  document.body.classList.toggle('is-fullscreen', isFs);
  const btn = document.getElementById('fsToggle');
  if(btn) btn.title = isFs ? '小画面モード' : '大画面モード';
}
document.addEventListener('fullscreenchange', syncFullscreenState);
document.addEventListener('webkitfullscreenchange', syncFullscreenState);
document.addEventListener('mozfullscreenchange', syncFullscreenState);
document.addEventListener('MSFullscreenChange', syncFullscreenState);
document.getElementById('fsToggle')?.addEventListener('click', toggleFullscreen);
</script>
