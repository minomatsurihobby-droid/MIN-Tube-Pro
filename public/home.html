        if (signals.historyIds && signals.historyIds.has(item.id)) return -50;
        if (isShortItem(item)) return -30;
        if (looksLikeCopyOrSpam(item, signals)) return -25;

        const title = String(item.title || '').toLowerCase();
        const ch = String(item.channelTitle || '').toLowerCase();
        const itTokens = tokensFromTitleLite(title);

        // 同一フィード内 (もしくは表示済み) と類似しすぎたら却下相当
        if (ctx && ctx.shownTokens && tooSimilarTitle(itTokens, ctx.shownTokens, 0.78)) return -20;

        let s = 0;

        // 1) チャンネル一致 (履歴上位)
        const topChSet = new Set((signals.topChannels || []).slice(0, 10).map(c => String(c).toLowerCase()));
        if (topChSet.has(ch)) s += 9;
        else {
          for (const c of topChSet) { if (c && (ch.includes(c) || c.includes(ch))) { s += 5; break; } }
        }

        // 2) ジャンルクラスタとの重なり (これが"至高"スコアの核)
        if (ctx && ctx.cluster) {
          const overlap = genreOverlapScore(itTokens, ctx.cluster.coreTokens);
          //  3 個以上重なれば"同ジャンル"として強優遇
          if (overlap >= 3) s += 8;
          else if (overlap === 2) s += 4;
          else if (overlap === 1) s += 1.5;
          else s -= 2; // ジャンル無関係は減点
        }

        // 3) 履歴ワード一致 (重み付き)
        (signals.topWords || []).slice(0, 12).forEach((w, idx) => {
          if (!w) return;
          const lw = String(w).toLowerCase();
          if (title.includes(lw)) s += Math.max(1, 5 - Math.floor(idx / 3));
        });

        // 4) 実在動画 (lengthText を持つ) を優遇
        if (item.lengthText) s += 1;
        // 異常に短い動画は減点 (=ノイズの可能性)
        if (item.lengthText && /^0:?[0-5]?\d?$/.test(String(item.lengthText).trim())) s -= 2;

        // 5) 視聴回数表記がある = 普及動画
        if (/(万|\u5104|M views|K views|回視聴|views)/i.test(item.viewCountText || '')) s += 1;

        // 6) ランダム性 (同点同士の入れ替え)
        s += Math.random() * 0.6;

        return s;
      }

      async function pickMinAiVideo() {
        let signals;
        try { signals = getHistorySignals(); }
        catch { signals = { topChannels: [], topWords: [], historyIds: new Set(), hist: [], liked: [], subs: [] }; }

        // ジャンルクラスタを構築
        const cluster = buildHistoryGenreCluster(signals);

        // クエリ構築: チャンネル + ワードペア + クラスタ上位
        const queries = [];
        const chs = signals.topChannels || [];
        const ws = signals.topWords || [];

        if (chs.length > 0) queries.push(chs[0]);
        if (ws.length >= 2) queries.push(`${ws[0]} ${ws[1]}`);
        else if (ws.length === 1) queries.push(ws[0]);
        if (chs.length > 1) queries.push(chs[1]);
        // クラスタ上位ワードペアも追加 (ジャンル多面性)
        if (cluster.sorted.length >= 2) {
          queries.push(`${cluster.sorted[0][0]} ${cluster.sorted[1][0]}`);
        }
        if (ws.length >= 3) queries.push(ws[2]);
        if (queries.length === 0) queries.push('trending');

        // 並列検索 (タイムアウト付き)
        const tasks = queries.slice(0, 5).map(async q => {
          try {
            if (q === 'trending') return await apiTrending(0);
            return await apiSearch(q, 0);
          } catch { return []; }
        });

        const all = await Promise.race([
          Promise.all(tasks),
          new Promise(resolve => setTimeout(() => resolve([]), MINAI_TIMEOUT_MS))
        ]);

        const merged = [];
        const idsSeen = new Set();
        (all || []).forEach(arr => (arr || []).forEach(it => {
          if (it && it.id && !idsSeen.has(it.id)) { idsSeen.add(it.id); merged.push(it); }
        }));
        if (merged.length === 0) return null;

        // すでにグリッドに表示されている動画のタイトル token を取って類似排除
        const shownTokens = [];
        try {
          if (videoGrid) {
            videoGrid.querySelectorAll('.video-card h3').forEach(h => {
              shownTokens.push(tokensFromTitleLite(h.textContent || ''));
            });
          }
        } catch {}

        // スコアリング (ジャンルクラスタ込み)
        const ctx = { cluster, shownTokens };
        let best = null, bestScore = -Infinity;
        for (const item of merged) {
          const sc = scoreCandidate(item, signals, ctx);
          if (sc > bestScore) { bestScore = sc; best = item; }
        }
        if (!best || bestScore <= -5) return null;

        // reasoning text
        let reason = 'あなたが好きそうな動画';
        try {
          const topChSet = new Set((signals.topChannels || []).slice(0, 8).map(c => String(c).toLowerCase()));
          if (topChSet.has(String(best.channelTitle || '').toLowerCase())) {
            reason = `「${best.channelTitle}」をよく見ているあなたへ`;
          } else {
            const titleLower = String(best.title || '').toLowerCase();
            const matched = (signals.topWords || []).find(w => w && titleLower.includes(String(w).toLowerCase()));
            if (matched) reason = `「${matched}」に関心があるあなたへ`;
            else {
              const itTokens = tokensFromTitleLite(titleLower);
              const overlapTokens = itTokens.filter(t => cluster.coreTokens.has(t)).slice(0, 2);
              if (overlapTokens.length) reason = `「${overlapTokens.join(' \u00b7 ')}」関連のおすすめ`;
            }
          }
        } catch {}

        return { item: best, reason };
      }

      // ============================================================
      //  Pro-AI (Groq) おすすめ: 1本だけ取得
      // ============================================================
      function buildProAiPrompt(signals) {
        const sys =
          "あなたはユーザーのYouTube視聴データから、その人が今もっとも喜びそうな『1本だけ』のおすすめ動画を選ぶプロのキュレーターAIです。\n" +
          "必ずYouTubeに実在する有名で人気のある動画タイトルを1本だけ、検索ヒットしやすい正確な形式で出力してください。\n" +
          "出力フォーマットは厳密に次の1行のJSONのみ: " +
          '{"title":"...","reason":"..."}' +
          "\n余計な前置き・コードブロック・改行・複数候補は禁止。reasonは20文字以内の日本語で『なぜこの動画?』を一言で。";
        const histLines = (signals.hist || []).slice(0, 10).map(h => `・「${(h.title||'').slice(0,80)}」 / ${h.channel||''}`).filter(s => s.length > 5);
        const likedLines = (signals.liked || []).slice(0, 6).map(h => `・「${(h.title||'').slice(0,80)}」 / ${h.channel||''}`).filter(s => s.length > 5);
        const subs = (signals.subs || []).slice(0, 8);

        let profile = '';
        if (subs.length) profile += `【登録チャンネル】\n${subs.map(s => '・' + s).join('\n')}\n\n`;
        if (likedLines.length) profile += `【高評価】\n${likedLines.join('\n')}\n\n`;
        if (histLines.length) profile += `【最近の視聴履歴】\n${histLines.join('\n')}`;
        if (!profile) profile = '【データなし】人気で多様なジャンルから定番動画を1本選んでください。';

        const usr = `以下のユーザー視聴データから、今この人に最もおすすめしたい『たった1本』のYouTube実在動画を選び、指定JSONで返してください。\n\n${profile}`;
        return [
          { role: 'system', content: sys },
          { role: 'user', content: usr }
        ];
      }

      function parseProAiJson(raw) {
        if (!raw) return null;
        // 余計な ``` を剥がす
        let t = String(raw).replace(/```[a-zA-Z]*\n?/g, '').replace(/```/g, '').trim();
        // 最初の { から最後の } までを抜き出す
        const i = t.indexOf('{'); const j = t.lastIndexOf('}');
        if (i >= 0 && j > i) t = t.slice(i, j + 1);
        try {
          const obj = JSON.parse(t);
          if (obj && typeof obj.title === 'string' && obj.title.trim().length >= 2) {
            return { title: obj.title.trim(), reason: String(obj.reason || '').slice(0, 40) };
          }
        } catch {}
        // fallback: 最初の行をタイトルとして使う
        const firstLine = String(raw).split(/[\r\n]/).map(s => s.trim()).find(s => s.length > 3);
        if (firstLine) return { title: firstLine.replace(/^["']|["']$/g, ''), reason: '' };
        return null;
      }

      async function searchTitleOnce(title) {
        if (!title) return null;
        // /api/1-search 優先、ダメなら /api/search
        try {
          const r = await fetch(`/api/1-search?q=${encodeURIComponent(title)}`);
          if (r.ok) {
            const data = await r.json();
            let item = null;
            if (Array.isArray(data)) item = data.find(x => x && x.type === 'video' && x.id) || data.find(x => x && x.id);
            else if (data && data.id) item = data;
            else if (data && Array.isArray(data.items)) item = data.items.find(x => x && x.id);
            else if (data && Array.isArray(data.results)) item = data.results.find(x => x && x.id);
            if (item && item.id) return item;
          }
        } catch {}
        try {
          const arr = await apiSearch(title, 0);
          const nonShort = (arr || []).filter(it => it && it.id && !isShortItem(it));
          if (nonShort.length > 0) return nonShort[0];
          if (arr && arr.length > 0) return arr[0];
        } catch {}
        return null;
      }

      async function pickProAiVideo() {
        // キャッシュ
        try {
          const cached = JSON.parse(localStorage.getItem(KEY_PROAI_CACHE) || 'null');
          if (cached && cached.ts && (Date.now() - cached.ts) < PROAI_CACHE_TTL_MS && cached.item && cached.item.id) {
            return cached;
          }
        } catch {}

        let signals;
        try { signals = getHistorySignals(); }
        catch { signals = { topChannels: [], topWords: [], historyIds: new Set(), hist: [], liked: [], subs: [] }; }

        let raw = '';
        try {
          raw = await Promise.race([
            callGroq(buildProAiPrompt(signals), { temperature: 0.6, max_tokens: 220 }),
            new Promise((_, rj) => setTimeout(() => rj(new Error('groq-timeout')), PROAI_TIMEOUT_MS))
          ]);
        } catch (e) {
          console.warn('[Pro-AI] groq failed:', e);
          return null;
        }
        const parsed = parseProAiJson(raw);
        if (!parsed || !parsed.title) return null;
        const found = await searchTitleOnce(parsed.title);
        if (!found || !found.id) return null;
        // shorts 排除
        if (isShortItem(found)) return null;

        const norm = {
          id: String(found.id),
          title: found.title || parsed.title,
          channelTitle: found.channelTitle || (found.shortBylineText && found.shortBylineText.runs && found.shortBylineText.runs[0] && found.shortBylineText.runs[0].text) || '',
          channelThumbnail: found.channelThumbnail || '',
          lengthText: (found.length && found.length.simpleText) || found.lengthText || '',
          viewCountText: found.viewCountText || '',
          publishedTimeText: found.publishedTimeText || ''
        };
        const out = { ts: Date.now(), item: norm, reason: parsed.reason || 'あなたに合うと判断' };
        try { localStorage.setItem(KEY_PROAI_CACHE, JSON.stringify(out)); } catch {}
        return out;
      }

      // ============================================================
      //  非同期 SLOT 注入: ローディングカード -> 結果 or 削除
      // ============================================================
      async function asyncInjectMinAi(loadingNode) {
        if (!loadingNode || !loadingNode.parentNode) return;
        let timedOut = false;
        const t = setTimeout(() => {
          timedOut = true;
          if (loadingNode && loadingNode.parentNode) loadingNode.remove();
        }, MINAI_TIMEOUT_MS + 500);
        try {
          const picked = await pickMinAiVideo();
          if (timedOut) return;
          if (!picked || !picked.item) {
            loadingNode.remove();
            return;
          }
          // 同じセッション内重複防止
          if (sessionShown.has(picked.item.id)) {
            loadingNode.remove();
            return;
          }
          sessionShown.add(picked.item.id);
          shownIds.add(picked.item.id);
          saveShown(shownIds);

          const card = buildAiCard({
            kind: 'minai',
            item: picked.item,
            reason: picked.reason || '',
            badge: 'MIN-AI のおすすめ'
          });
          if (loadingNode.parentNode) loadingNode.replaceWith(card);
        } catch (e) {
          console.warn('[MIN-AI] inject error:', e);
          if (loadingNode && loadingNode.parentNode) loadingNode.remove();
        } finally {
          clearTimeout(t);
        }
      }

      async function asyncInjectProAi(loadingNode) {
        if (!loadingNode || !loadingNode.parentNode) return;
        let timedOut = false;
        const t = setTimeout(() => {
          timedOut = true;
          if (loadingNode && loadingNode.parentNode) loadingNode.remove();
        }, PROAI_TIMEOUT_MS + 500);
        try {
          const picked = await pickProAiVideo();
          if (timedOut) return;
          if (!picked || !picked.item) {
            loadingNode.remove();
            return;
          }
          if (sessionShown.has(picked.item.id)) {
            // 既出: 静かに消す
            loadingNode.remove();
            return;
          }
          sessionShown.add(picked.item.id);
          shownIds.add(picked.item.id);
          saveShown(shownIds);

          const card = buildAiCard({
            kind: 'proai',
            item: picked.item,
            reason: picked.reason || '',
            badge: 'MIN-Pro-AI のおすすめ',
            subLabel: '✨ あなたへの一本'
          });
          if (loadingNode.parentNode) loadingNode.replaceWith(card);
        } catch (e) {
          console.warn('[Pro-AI] inject error:', e);
          if (loadingNode && loadingNode.parentNode) loadingNode.remove();
        } finally {
          clearTimeout(t);
        }
      }

      // ============================================================
      //  Grid 観測: 一定枚数の実体カードが入るたび、MIN-AI スロットを
      //  自動挿入する (検索結果ページ等にも作用)
      // ============================================================
      let cardsSinceLastMinAi = 0;
      let minAiPlacedCountThisSession = 0;
      const MAX_MINAI_PER_SESSION = 4;

      function placeMinAiSlotIfNeeded() {
        if (minAiPlacedCountThisSession >= MAX_MINAI_PER_SESSION) return;
        if (!videoGrid) return;

        // 既に未解決の MIN-AI ローディングがあるなら追加しない
        if (videoGrid.querySelector('[data-ai-loading="minai"]')) return;

        // AI設定 + 履歴ゲート (最低1本動画を見た後に発動)
        try {
          if (window.MTAiSettings && !window.MTAiSettings.canRunAi('minai')) return;
        } catch {}

        // 履歴等もデータがあるときだけ
        let signals;
        try { signals = getHistorySignals(); }
        catch { signals = null; }
        const hasData = signals && signals.hist && signals.hist.length >= 1;
        if (!hasData) return;

        const loadingNode = buildLoadingCard(
          'minai',
          'AIがあなたにおすすめの動画を検索しています',
          'MIN-AI が分析中...'
        );
        videoGrid.appendChild(loadingNode);
        minAiPlacedCountThisSession++;
        asyncInjectMinAi(loadingNode);
      }

      function placeProAiSlotIfNeeded() {
        if (!videoGrid) return;
        if (videoGrid.querySelector('[data-ai-loading="proai"]')) return;

        // AI設定 + 履歴ゲート
        try {
          if (window.MTAiSettings && !window.MTAiSettings.canRunAi('proai')) return;
        } catch {}

        // データ確認(なくても trending 推薦は出すが、ない場合は省略でもよい)
        let signals;
        try { signals = getHistorySignals(); }
        catch { signals = null; }
        const hasData = signals && signals.hist && signals.hist.length >= 1;
        if (!hasData) return;

        const loadingNode = buildLoadingCard(
          'proai',
          'MIN-Pro-AIがあなたへの一本を選んでいます',
          'Groq で分析中...'
        );
        videoGrid.appendChild(loadingNode);
        asyncInjectProAi(loadingNode);
      }

      // 実体カードが追加されたら counter を進めて、必要に応じてスロット挿入
      function setupGridObserver() {
        if (!videoGrid) return;
        const mo = new MutationObserver((mutations) => {
          for (const m of mutations) {
            if (!m.addedNodes) continue;
            for (const n of m.addedNodes) {
              if (!(n instanceof HTMLElement)) continue;
              if (!n.classList) continue;
              // 実体動画カードだけ count
              const isReal =
                n.classList.contains('video-card') &&
                !n.classList.contains('mpx-skeleton-card') &&
                !n.classList.contains('mpx-mymix-placeholder') &&
                !n.classList.contains('minai-loading-wrap') &&
                !n.classList.contains('proai-loading-wrap') &&
                !n.dataset.aiLoading;
              if (isReal) {
                cardsSinceLastMinAi++;
                if (cardsSinceLastMinAi >= MINAI_INSERT_EVERY) {
                  cardsSinceLastMinAi = 0;
                  // 設定 + 履歴ゲート
                  let allow = true;
                  try { if (window.MTAiSettings && !window.MTAiSettings.canRunAi('minai')) allow = false; } catch {}
                  if (allow) setTimeout(placeMinAiSlotIfNeeded, 40);
                }
              }
            }
          }
        });
        mo.observe(videoGrid, { childList: true });
      }

      // ============================================================
      //  STARTUP
      //   - Pro-AI は 1枚目の後ろに挿入 (画面トップ中・上部)
      //   - MIN-AI は setupGridObserver 側で 2枚目の後ろに自動挿入
      // ============================================================
      function startup() {
        try { setupGridObserver(); } catch (e) { console.warn(e); }

        // AI設定 + 履歴ゲート — 履歴がない場合は MIN-AI / Pro-AI を一切起動しない
        let aiAllowed = true;
        try {
          if (window.MTAiSettings) {
            if (!window.MTAiSettings.isEnabled('master')) aiAllowed = false;
            else if (!window.MTAiSettings.hasAnyHistory()) aiAllowed = false;
          }
        } catch {}
        if (!aiAllowed) return;

        let count = 0;
        try { count = bumpLoadCount(); } catch {}
        // Pro-AI の表示判定 (設定で OFF なら表示しない)
        let proaiAllowed = true;
        try { if (window.MTAiSettings && !window.MTAiSettings.isEnabled('proai')) proaiAllowed = false; } catch {}
        const shouldShowProAi = proaiAllowed && ((count - 1) % PROAI_INTERVAL === 0);

        if (shouldShowProAi) {
          let placed = false;
          const place = () => {
            if (placed) return false;
            if (!videoGrid) return false;
            const real = videoGrid.querySelector('.video-card:not(.mpx-skeleton-card):not(.mpx-mymix-placeholder):not([data-ai-loading])');
            if (!real) return false;
            placed = true;
            // 1枚目の直後に挿入 (＝2番目の位置・画面トップ・上部)
            const realCards = Array.from(videoGrid.querySelectorAll('.video-card:not(.mpx-skeleton-card):not(.mpx-mymix-placeholder):not([data-ai-loading])'));
            const anchor = realCards[Math.min(0, realCards.length - 1)];
            const loadingNode = buildLoadingCard(
              'proai',
              'MIN-Pro-AIがあなたへの一本を選んでいます',
              'Groq AI が分析中...'
            );
            if (anchor && anchor.parentNode === videoGrid) {
              videoGrid.insertBefore(loadingNode, anchor.nextSibling);
            } else if (videoGrid) {
              videoGrid.appendChild(loadingNode);
            }
            asyncInjectProAi(loadingNode);
            return true;
          };
          const tryMo = new MutationObserver(() => { if (place()) tryMo.disconnect(); });
          try { tryMo.observe(videoGrid || document.body, { childList: true }); } catch {}
          setTimeout(() => { try { tryMo.disconnect(); } catch {} }, 10000);
          place();
        }
      }

      // 全エンジン読み込み後にスタート
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(startup, 30);
      } else {
        window.addEventListener('DOMContentLoaded', () => setTimeout(startup, 30));
      }

      window.MinAI = {
        version: '2.0',
        pickMinAiVideo,
        pickProAiVideo,
        forceMinAi: placeMinAiSlotIfNeeded,
        forceProAi: placeProAiSlotIfNeeded,
        resetShown: () => { try { localStorage.removeItem(KEY_MINAI_SHOWN); } catch {} },
        resetLoadCount: () => { try { localStorage.removeItem(KEY_LOAD_COUNT); } catch {} }
      };
      console.log('%c🌟 MIN-AI Engine v2.0 ready', 'background:linear-gradient(120deg,#00d4ff,#4f8bff,#00ffa1);color:#0a0613;padding:4px 10px;border-radius:4px;font-weight:bold;');
    })();

    /* ============================================================================== */
    /* ================ 🎵 AUTO PLAYLIST ENGINE (added 2026) ========================= */
    /* ============================================================================== */
    /*  - 視聴履歴が 10 本以上に達した時点で自動的に MIN-Pro-AI を実行                */
    /*  - 結果のプレイリストをホーム動画グリッド最上部に「プレイリストカード」として表示 */
    /*  - 1 時間キャッシュ (履歴がさらに 5 本増えたら再生成)                            */
    /* ============================================================================== */
    (function AutoPlaylistEngine() {
      'use strict';
      if (!window.__MPX) {
        console.warn('[AutoPlaylist] MIN-Pro-AI core not ready; skipping');
        return;
      }
      const MPX = window.__MPX;
      const { callGroq, getHistorySignals, getThumbForId, isShortItem, escapeHtmlText, escapeAttr } = MPX;

      const KEY_CACHE          = 'mt_auto_playlist_v1';
      const KEY_BASIS          = 'mt_auto_playlist_basis';    // 何本時点で生成したか
      const TTL_MS             = 60 * 60 * 1000;              // 1h
      const MIN_HIST_TO_RUN    = 10;
      const HIST_BUMP_FOR_REFRESH = 5;                        // +5本でリフレッシュ
      const MAX_TITLES         = 12;
      const MIN_RESULTS        = 4;
      const HARD_TIMEOUT_MS    = 30000;

      function safeCanRun() {
        try {
          if (!window.MTAiSettings) return true;
          return window.MTAiSettings.canRunAi('autoPlaylist');
        } catch { return true; }
      }

      function getCached() {
        try {
          const v = JSON.parse(localStorage.getItem(KEY_CACHE) || 'null');
          if (!v || !v.ts) return null;
          if ((Date.now() - v.ts) >= TTL_MS) return null;
          if (!Array.isArray(v.items) || v.items.length < MIN_RESULTS) return null;
          // 履歴が大幅に増えたらキャッシュ無効
          const curBasis = (window.MTAiSettings && window.MTAiSettings.historyVideoCount()) || 0;
          const basis = parseInt(localStorage.getItem(KEY_BASIS) || '0', 10) || 0;
          if (basis && (curBasis - basis) >= HIST_BUMP_FOR_REFRESH) return null;
          return v.items;
        } catch { return null; }
      }
      function saveCache(items) {
        try {
          localStorage.setItem(KEY_CACHE, JSON.stringify({ ts: Date.now(), items }));
          const cur = (window.MTAiSettings && window.MTAiSettings.historyVideoCount()) || 0;
          localStorage.setItem(KEY_BASIS, String(cur));
        } catch {}
      }

      const SYSTEM_PROMPT =
        "あなたはユーザーのYouTube視聴データから、その人が必ず喜ぶプレイリストを作るプロのキュレーターです。\n" +
        "【厳守】\n" +
        "1. 必ず6本以上の異なる動画を推薦してください。\n" +
        "2. YouTubeに実在する有名で人気のある動画のタイトルのみを使用してください。\n" +
        "3. タイトルにはアーティスト名/チャンネル名を含め、検索ヒット率の高い表記にしてください。\n" +
        "4. タイトルとタイトルの間は半角「.」のみで区切り、改行・番号・記号は不要です。\n" +
        "5. タイトルの末尾には必ず「.」をつけてください。\n" +
        "6. 例: アーティスト名 - 曲名.アーティスト名 - 曲名.\n" +
        "7. ジャンル多様性を考慮して、ユーザーの趣味領域を中心に構成してください。";

      function buildUserPrompt(signals) {
        const histLines = (signals.hist || []).slice(0, 20)
          .map(h => `・「${(h.title||'').slice(0,80)}」 / ${h.channel||''}`)
          .filter(s => s.length > 5);
        const likedLines = (signals.liked || []).slice(0, 10)
          .map(h => `・「${(h.title||'').slice(0,80)}」 / ${h.channel||''}`)
          .filter(s => s.length > 5);
        const subs = (signals.subs || []).slice(0, 10);
        let profile = '';
        if (subs.length) profile += `【登録チャンネル】\n${subs.map(s => '・' + s).join('\n')}\n\n`;
        if (likedLines.length) profile += `【高評価した動画】\n${likedLines.join('\n')}\n\n`;
        if (histLines.length) profile += `【最近の視聴履歴】\n${histLines.join('\n')}`;
        if (!profile) profile = '【データなし】人気の高い多様なジャンルの動画を推薦してください。';
        return `以下はユーザーのYouTube視聴データです。この人の好みを深く分析し、必ず6本以上の実在する人気YouTube動画でプレイリストを作ってください。\n\n${profile}`;
      }

      function parseTitles(raw) {
        if (!raw) return [];
        let t = String(raw).replace(/```[\s\S]*?```/g, ' ').replace(/^\s*[-*\d+.)\s]+/gm, '');
        const parts = t.split('.').map(s => s.trim()).filter(s => s.length >= 3);
        const titles = [];
        const seen = new Set();
        for (const p of parts) {
          let title = p.replace(/^[\s\-*\u30fb\u2022\u25cf\u25cb\u25b6\u25b7\u261e\u261b]+/, '').trim();
          if (title.length < 3 || title.length > 120) continue;
          if (/^(こちら|以下|それでは|了解|わかりました|note|note:|playlist)/i.test(title)) continue;
          const key = title.toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);
          titles.push(title);
        }
        return titles.slice(0, MAX_TITLES);
      }

      async function searchOneTitle(title) {
        if (!title) return null;
        try {
          const r = await fetch(`/api/1-search?q=${encodeURIComponent(title)}`);
          if (r.ok) {
            const data = await r.json();
            let item = null;
            if (Array.isArray(data)) item = data.find(x => x && x.type === 'video' && x.id) || data.find(x => x && x.id);
            else if (data && data.id) item = data;
            else if (data && Array.isArray(data.items)) item = data.items.find(x => x && x.id);
            else if (data && Array.isArray(data.results)) item = data.results.find(x => x && x.id);
            if (item && item.id) return item;
          }
        } catch {}
        // フォールバック: /api/search
        try {
          const r = await fetch(`/api/search?q=${encodeURIComponent(title)}&page=0`);
          if (r.ok) {
            const d = await r.json();
            const arr = (d && d.items) || [];
            const found = arr.find(x => x && x.id && !isShortItem(x));
            if (found) return found;
          }
        } catch {}
        return null;
      }

      async function generate() {
        let signals;
        try { signals = getHistorySignals(); }
        catch { signals = null; }
        if (!signals || !Array.isArray(signals.hist) || signals.hist.length < MIN_HIST_TO_RUN) return null;

        let raw;
        try {
          raw = await Promise.race([
            callGroq(
              [
                { role: 'system', content: SYSTEM_PROMPT },
                { role: 'user', content: buildUserPrompt(signals) }
              ],
              { temperature: 0.7, max_tokens: 900, timeout: 18000 }
            ),
            new Promise((_, rj) => setTimeout(() => rj(new Error('autopl-timeout')), HARD_TIMEOUT_MS))
          ]);
        } catch (e) {
          console.warn('[AutoPlaylist] groq failed:', e);
          return null;
        }

        const titles = parseTitles(raw);
        if (titles.length < 4) return null;

        const results = [];
        const CONCURRENCY = 4;
        let cursor = 0;
        async function worker() {
          while (cursor < titles.length) {
            const myIdx = cursor++;
            const ti = titles[myIdx];
            const found = await Promise.race([
              searchOneTitle(ti),
              new Promise(resolve => setTimeout(() => resolve(null), 5000))
            ]);
            if (found && found.id) {
              if (isShortItem(found)) continue;
              results.push({
                _idx: myIdx,
                id: String(found.id),
                title: found.title || ti,
                channelTitle: found.channelTitle || (found.shortBylineText && found.shortBylineText.runs && found.shortBylineText.runs[0] && found.shortBylineText.runs[0].text) || '',
                thumbnail: getThumbForId(found.id),
                lengthText: (found.length && found.length.simpleText) || found.lengthText || ''
              });
            }
          }
        }
        await Promise.all(Array.from({ length: CONCURRENCY }, () => worker()));
        results.sort((a, b) => a._idx - b._idx);
        const uniq = [];
        const seenIds = new Set();
        for (const r of results) {
          if (seenIds.has(r.id)) continue;
          seenIds.add(r.id);
          uniq.push({
            id: r.id, title: r.title, channelTitle: r.channelTitle,
            thumbnail: r.thumbnail, lengthText: r.lengthText
          });
        }
        if (uniq.length < MIN_RESULTS) return null;
        return uniq.slice(0, MAX_TITLES);
      }

      function buildLoadingCard() {
        const wrap = document.createElement('div');
        wrap.className = 'video-card mt-autopl-loading';
        wrap.setAttribute('data-autopl-loading', '1');
        wrap.innerHTML = `
          <div class="mt-autopl-load-thumb">
            <div class="mt-autopl-load-content">
              <div class="mt-autopl-load-orb"></div>
              <div class="mt-autopl-load-text">✨ MIN-Pro-AI があなた専用プレイリストを作成中</div>
              <div class="mt-autopl-load-sub">視聴履歴を分析しています...</div>
            </div>
          </div>
          <div class="meta">
            <div class="mpx-skel-avatar" style="width:36px;height:36px;border-radius:50%;"></div>
            <div class="mpx-skel-lines" style="flex:1;display:flex;flex-direction:column;gap:6px;">
              <div class="mpx-skel-line long"></div>
              <div class="mpx-skel-line short"></div>
            </div>
          </div>`;
        return wrap;
      }

      function buildCard(items) {
        const first = items[0];
        const a = document.createElement('a');
        a.href = 'javascript:void(0)';
        a.className = 'video-card mt-autopl-card';
        a.setAttribute('role', 'button');
        a.setAttribute('aria-label', `MIN-Pro-AI プレイリスト: ${items.length}本の動画`);
        const safeFirstTitle = escapeHtmlText((first.title || '').slice(0, 50));
        const tail = (first.title || '').length > 50 ? '...' : '';
        a.innerHTML = `
          <div class="thumb">
            <img src="${first.thumbnail}" loading="lazy" alt="MIN-Pro-AI プレイリスト">
            <div class="mt-autopl-stack"></div>
            <div class="mt-autopl-badge"><span class="mt-autopl-spark">✨</span> MIN-Pro-AI プレイリスト</div>
            <div class="mt-autopl-overlay">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              全 ${items.length} 本
            </div>
          </div>
          <div class="meta">
            <span class="channel-avatar" data-initial="✨" style="text-decoration:none;cursor:default;background:linear-gradient(120deg,#ffb86b,#ff6bd6,#a26bff);">
              <span class="avatar-initial">✨</span>
            </span>
            <div class="details">
              <h3>あなた専用 MIN-Pro-AI プレイリスト</h3>
              <span class="channel-name" style="color:var(--text-muted);">MIN-Pro-AI ・ 視聴履歴から自動生成</span>
              <div class="video-stats">${safeFirstTitle}${tail}</div>
            </div>
          </div>`;
        a.addEventListener('click', (e) => {
          e.preventDefault();
          openPlayer(items);
        });
        return a;
      }

      function openPlayer(items) {
        const win = window.open('about:blank', '_blank');
        if (!win) { alert('ポップアップがブロックされました。許可してもう一度お試しください。'); return; }
        const payload = JSON.stringify(items).replace(/<\/script/g, '<\\/script');
        const html = `<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box;}html,body{margin:0;padding:0;background:#0f0f0f;color:#f1f1f1;font-family:'Roboto',Arial,sans-serif;height:100%;}

</style></head><body>
<div class="app">
  <div class="player-wrap">
    <div class="player-box"><iframe id="yt" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
    <div class="now-playing"><div class="np-title" id="npTitle">読み込み中...</div><div class="np-channel" id="npChannel"></div></div>
  </div>
  <aside class="pl-side">
    <div class="pl-head"><span class="spark">✨</span><div class="pl-title">MIN-Pro-AI プレイリスト<span class="pl-sub">視聴履歴から自動生成</span></div><div class="pl-count" id="plCount"></div></div>
    <div class="pl-list" id="plList"></div>
    <div class="pl-controls">
      <button id="btnPrev">⏮ 前</button>
      <button id="btnShuffle">🔀 シャッフル</button>
      <button id="btnNext" class="play-pri">次 ⏭</button>
    </div>
  </aside>
</div>
<script>
const items = ${payload};
let current = 0;
const yt = document.getElementById('yt');
const list = document.getElementById('plList');
const npTitle = document.getElementById('npTitle');
const npChannel = document.getElementById('npChannel');
const plCount = document.getElementById('plCount');
plCount.textContent = items.length + ' 本';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
  list.innerHTML = items.map((it,i)=>'<div class="pl-item'+(i===current?' active':'')+'" data-i="'+i+'"><div class="pl-idx">'+(i===current?'▶':(i+1))+'</div><img class="pl-thumb" src="'+esc(it.thumbnail)+'" onerror="this.src=\\'https://i.ytimg.com/vi/'+esc(it.id)+'/hqdefault.jpg\\'"><div class="pl-info"><div class="pl-it-title">'+esc(it.title)+'</div><div class="pl-it-ch">'+esc(it.channelTitle||'')+'</div></div></div>').join('');
  list.querySelectorAll('.pl-item').forEach(el=>{el.addEventListener('click',()=>{current=parseInt(el.dataset.i,10);play();});});
}
function play(){const it=items[current];if(!it)return;yt.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(it.id)+'?autoplay=1&rel=0&modestbranding=1&enablejsapi=1';npTitle.textContent=it.title||'';npChannel.textContent=it.channelTitle||'';render();const a=list.querySelector('.pl-item.active');if(a)a.scrollIntoView({block:'nearest',behavior:'smooth'});}
document.getElementById('btnPrev').addEventListener('click',()=>{current=(current-1+items.length)%items.length;play();});
document.getElementById('btnNext').addEventListener('click',()=>{current=(current+1)%items.length;play();});
document.getElementById('btnShuffle').addEventListener('click',()=>{for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}current=0;play();});
render();play();
<\/script></body></html>`;
        win.document.open(); win.document.write(html); win.document.close();
      }

      // 上部挿入: グリッドの最初のリアルカードの「直前」に挿入
      // 既にカードが入っているか挿入予定があるかをチェック
      let placedThisSession = false;
      async function placeAtTop() {
        if (placedThisSession) return;
        if (!safeCanRun()) return;
        const curHist = (window.MTAiSettings && window.MTAiSettings.historyVideoCount()) || 0;
        if (curHist < MIN_HIST_TO_RUN) return;

        const grid = document.getElementById('videoGrid');
        if (!grid) return;

        // 既に表示済みなら何もしない
        if (grid.querySelector('.mt-autopl-card') || grid.querySelector('[data-autopl-loading]')) return;

        placedThisSession = true;

        // 最初のリアルカードが現れるのを待ち、その「直前」にローディングカードを挿入
        const insertLoading = () => {
          const realCard = grid.querySelector(
            '.video-card:not(.mpx-skeleton-card):not(.mpx-mymix-placeholder):not(.minai-loading-wrap):not(.proai-loading-wrap):not([data-ai-loading]):not(.mt-autopl-loading):not(.mt-autopl-card)'
          );
          if (!realCard) return null;
          const loadingNode = buildLoadingCard();
          grid.insertBefore(loadingNode, realCard);
          return loadingNode;
        };
        let loadingNode = insertLoading();
        if (!loadingNode) {
          await new Promise((resolve) => {
            const mo = new MutationObserver(() => {
              loadingNode = insertLoading();
              if (loadingNode) { mo.disconnect(); resolve(); }
            });
            mo.observe(grid, { childList: true });
            setTimeout(() => { try { mo.disconnect(); } catch {} resolve(); }, 12000);
          });
          if (!loadingNode) {
            // それでもダメなら appendChild
            loadingNode = buildLoadingCard();
            grid.appendChild(loadingNode);
          }
        }

        // キャッシュ確認
        let items = getCached();
        if (!items) {
          try {
            items = await generate();
          } catch (e) {
            console.warn('[AutoPlaylist] generate err:', e);
            items = null;
          }
          if (items && items.length >= MIN_RESULTS) saveCache(items);
        }

        if (!items || items.length < MIN_RESULTS) {
          // 静かに削除
          if (loadingNode && loadingNode.parentNode) loadingNode.remove();
          return;
        }
        const card = buildCard(items);
        if (loadingNode && loadingNode.parentNode) {
          requestAnimationFrame(() => {
            if (loadingNode.parentNode) loadingNode.replaceWith(card);
          });
        } else {
          // フォールバック
          const ref = grid.querySelector('.video-card:not(.mpx-skeleton-card)');
          if (ref) grid.insertBefore(card, ref);
          else grid.appendChild(card);
        }
      }

      // 起動: ホーム画面のときだけ
      function shouldRunOnThisPage() {
        // 検索やショート画面では出さない (チップ active 判定)
        const activeChip = document.querySelector('.chip.active');
        if (!activeChip) return true;
        const q = activeChip.dataset.q;
        return (!q || q === 'recommended' || q === 'trending');
      }
      function bootstrap() {
        try {
          if (shouldRunOnThisPage()) placeAtTop();
        } catch (e) { console.warn('[AutoPlaylist] bootstrap err:', e); }
      }
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(bootstrap, 50);
      } else {
        window.addEventListener('DOMContentLoaded', () => setTimeout(bootstrap, 50));
      }

      // 設定変更で再評価
      window.addEventListener('mt-ai-settings-changed', (e) => {
        try {
          const grid = document.getElementById('videoGrid');
          if (!grid) return;
          const existing = grid.querySelector('.mt-autopl-card, [data-autopl-loading]');
          if (e.detail && (e.detail.name === 'master' || e.detail.name === 'autoPlaylist')) {
            if (!safeCanRun()) {
              // 表示を消す
              if (existing) existing.remove();
              placedThisSession = false; // 後で再評価できるよう
            } else if (!existing) {
              placedThisSession = false;
              setTimeout(bootstrap, 0);
            }
          }
        } catch {}
      });

      window.MTAutoPlaylist = {
        version: '1.0',
        placeAtTop,
        regenerate: async () => {
          try { localStorage.removeItem(KEY_CACHE); localStorage.removeItem(KEY_BASIS); } catch {}
          placedThisSession = false;
          bootstrap();
        },
        clearCache: () => {
          try { localStorage.removeItem(KEY_CACHE); localStorage.removeItem(KEY_BASIS); } catch {}
        }
      };
      console.log('%c🎵 Auto-Playlist Engine v1.0 ready', 'background:linear-gradient(120deg,#ffb86b,#ff6bd6,#a26bff);color:#fff;padding:4px 10px;border-radius:4px;font-weight:bold;');
    })();
    /* ============================================================================== */
    /* ================ END OF AUTO PLAYLIST ENGINE  ================================= */
    /* ============================================================================== */

    /* ============================================================================== */
    /* ================ END OF MIN-AI ENGINE v2.0  =================================== */
    /* ============================================================================== */


    
  </script>
