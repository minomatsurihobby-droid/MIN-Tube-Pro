  </style>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getDatabase, ref, get, set, child } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPkgzCIOP3-ln0eX6043s2G3tyZu4uj18",
    authDomain: "message-site-d283b.firebaseapp.com",
    databaseURL: "https://message-site-d283b-default-rtdb.firebaseio.com",
    projectId: "message-site-d283b",
    storageBucket: "message-site-d283b.firebasestorage.app",
    messagingSenderId: "58182307350",
    appId: "1:58182307350:web:34a295f442ed2ce4ffaf37",
    measurementId: "G-BGT7PTEVK2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const currentUrl = window.location.origin;

if (!currentUrl.includes("projects") && !currentUrl.includes("private") && !currentUrl.includes("cloudflare")) {
      const safeKey = btoa(currentUrl).replace(/[=+/]/g, '_');
      const dbRef = ref(db);

      get(child(dbRef, `public_domains/${safeKey}`)).then((snapshot) => {
        if (!snapshot.exists()) {
          set(ref(db, `public_domains/${safeKey}`), {
            url: currentUrl,
            timestamp: Date.now()
          });
        }
      });
  }
</script>

  <script>
    // ===== Thumbnail Server Logic =====
    function getThumbUrl(id, type) {
      const mode = localStorage.getItem('thumbServer') || 'default';
      if (mode === 'custom') {
        return `/img/${id}`;
      }
      return type === 'hq' ? `https://i3.ytimg.com/vi/${id}/hqdefault.jpg` : `https://i3.ytimg.com/vi/${id}/mqdefault.jpg`;
    }

    const videoGrid = document.getElementById('videoGrid');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const loading = document.getElementById('loading');
    const shortsSection = document.getElementById('shortsSection');
    const shortsRow = document.getElementById('shortsRow');
    const shortsToggle = document.getElementById('shortsToggle');
    const sidebar = document.getElementById('sidebar');

    let displayedIds = new Set();
    let isFetching = false;
    let currentPage = 0;
    let currentQuery = 'trending';
    let shortsExpanded = true;

    // Sidebar toggle
    document.getElementById('menuBtn').addEventListener('click', () => {
      sidebar.classList.toggle('expanded');
    });

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function fetchEndpoint(endpoint) {
      try {
        const res = await fetch(endpoint);
        if (!res.ok) return [];
        const data = await res.json();
        return data.items || [];
      } catch (err) {
        return [];
      }
    }

    function normalizeAndFilterList(list) {
      const out = [];
      for (const it of list) {
        if (!it) continue;
        let id = null;
        if (typeof it.id === 'string') id = it.id;
        else if (it.id && typeof it.id === 'object') {
          id = it.id.videoId || it.id.channelId || it.id.playlistId || it.id;
        } else if (it.videoId) { id = it.videoId; }
        if (!id) continue;
        id = String(id);
        if (id.startsWith('UC')) continue;
        it.id = id;
        out.push(it);
      }
      return out;
    }

    function updateShortsToggleUI() {
      if (!shortsSection || !shortsToggle || !shortsRow) return;
      if (!shortsSection.style.display || shortsSection.style.display === 'none') {
        shortsToggle.style.display = 'none';
        return;
      }
      shortsToggle.style.display = 'inline-flex';
      if (shortsExpanded) {
        shortsToggle.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg> 非表示`;
        shortsToggle.setAttribute('aria-expanded', 'true');
        shortsRow.style.display = 'flex';
      } else {
        shortsToggle.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg> 表示`;
        shortsToggle.setAttribute('aria-expanded', 'false');
        shortsRow.style.display = 'none';
      }
    }

    shortsToggle.addEventListener('click', () => {
      shortsExpanded = !shortsExpanded;
      updateShortsToggleUI();
    });

    async function loadContent(query = 'trending', page = 0) {
      if (isFetching) return;
      isFetching = true;
      loading.style.display = 'block';

      if (page === 0) {
        displayedIds.clear();
        videoGrid.innerHTML = '';
        shortsRow.innerHTML = '';
        shortsSection.style.display = 'none';
        shortsExpanded = true;
      }

      const isDefault = query === 'trending';
      const endpoint = isDefault
        ? `/api/trending?page=${page}`
        : `/api/search?q=${encodeURIComponent(query)}&page=${page}`;

      try {
        let items = await fetchEndpoint(endpoint);
        items = normalizeAndFilterList(items);

        if (page === 0) {
          const MIN_ITEMS = 12;
          if (items.length < MIN_ITEMS) {
            const chips = Array.from(document.querySelectorAll('.chip'))
              .map(c => c.dataset.q).filter(q => q && q !== query);
            shuffleArray(chips);
            const supplementPromises = [];
            const maxSources = Math.min(4, chips.length);
            for (let i = 0; i < maxSources; i++) {
              const cat = chips[i];
              const ep = cat === 'trending' ? `/api/trending?page=0` : `/api/search?q=${encodeURIComponent(cat)}&page=0`;
              supplementPromises.push(fetchEndpoint(ep));
            }
            const supplementResults = await Promise.all(supplementPromises);
            const combined = items.concat(...supplementResults.flat());
            const filteredCombined = normalizeAndFilterList(combined);
            const seen = new Set();
            const deduped = [];
            for (const it of filteredCombined) {
              if (!it || !it.id) continue;
              if (seen.has(it.id)) continue;
              seen.add(it.id);
              deduped.push(it);
            }
            items = shuffleArray(deduped);
          }
        }

        if (items.length === 0 && page === 0) {
          videoGrid.innerHTML = '<p class="empty">動画が見つかりませんでした。</p>';
        }

        let shorts = [];
        const normals = [];
        items.forEach(item => {
          if (!item || !item.id) return;
          const title = item.title || '';
          if (title.includes('#')) shorts.push(item);
          else normals.push(item);
        });

        if (page === 0) {
          if (currentQuery !== 'trending' && shorts.length > 0 && shorts.length <= 4) {
            const needed = 6;
            const addedShortIds = new Set(shorts.map(s => s.id));
            for (let p = 1; p <= 3 && shorts.length < needed; p++) {
              const ep = `/api/search?q=${encodeURIComponent(currentQuery)}&page=${p}`;
              try {
                const resItems = await fetchEndpoint(ep);
                const norm = normalizeAndFilterList(resItems);
                for (const it of norm) {
                  if (!it || !it.id || addedShortIds.has(it.id)) continue;
                  if ((it.title || '').includes('#')) {
                    shorts.push(it);
                    addedShortIds.add(it.id);
                    if (shorts.length >= needed) break;
                  }
                }
              } catch (e) {}
            }
          }

          if (shorts.length <= 4) {
            shortsSection.style.display = 'none';
          } else {
            shortsSection.style.display = 'block';
            shorts.forEach(item => {
              if (!item || !item.id || displayedIds.has(item.id)) return;
              displayedIds.add(item.id);
              const a = document.createElement('a');
              a.className = 'short-card';
              a.href = `/video/${item.id}`;
              const thumbUrl = getThumbUrl(item.id, 'hq');
              const channel = item.channelTitle || '';
              const viewText = item.viewCountText || '';
              a.innerHTML = `
                <div class="short-thumb">
                  <img src="${thumbUrl}" loading="lazy" alt="${item.title || 'ショート'}">
                  <div class="short-overlay">
                    <div class="short-title">${item.title || ''}</div>
                    <div class="short-views">${viewText}</div>
                  </div>
                </div>
              `;
              shortsRow.appendChild(a);
            });
            updateShortsToggleUI();
          }
        }

        normals.forEach(item => {
          if (!item || !item.id || displayedIds.has(item.id)) return;
          displayedIds.add(item.id);

          const card = document.createElement('a');
          card.className = 'video-card';
          card.href = `/video/${item.id}`;
          const thumbUrl = getThumbUrl(item.id, 'mq');
          const channel = item.channelTitle || '';
          const viewText = item.viewCountText || '';
          const published = item.publishedTimeText || '';
          const initial = channel ? channel[0].toUpperCase() : 'C';
          // チャンネルアバター画像URL（ui-avatars フォールバック）
          const avatarUrl = item.channelThumbnail || item.channelImage || '';
          const subKey = 'subscribed_' + channel;
          const isSub = localStorage.getItem(subKey) === 'true';

          card.innerHTML = `
            <div class="thumb">
              <img src="${thumbUrl}" loading="lazy" alt="${item.title || '動画'}">
              ${item.lengthText ? `<div class="duration-badge">${item.lengthText}</div>` : ''}
            </div>
            <div class="meta">
              <a href="/channel/${encodeURIComponent(channel)}" class="channel-avatar" data-initial="${initial}" onclick="event.stopPropagation()" style="text-decoration:none;">
                <span class="avatar-initial">${initial}</span>
                ${avatarUrl ? `<img src="${avatarUrl}" alt="${channel}" onload="this.classList.add('loaded')" onerror="this.remove()">` : ''}
              </a>
              <div class="details">
                <h3>${item.title || ''}</h3>
                <a href="/channel/${encodeURIComponent(channel)}" class="channel-name" onclick="event.stopPropagation()" style="text-decoration:none;color:var(--text-muted);">${channel}</a>
                <div class="video-stats">${viewText}${viewText && published ? ' • ' : ''}${published || item.publishedTimeText || ''}</div>
              </div>
              <button class="card-menu-btn" aria-label="メニュー" data-id="${item.id}" data-title="${(item.title||'').replace(/"/g,'&quot;')}" data-channel="${channel.replace(/"/g,'&quot;')}" data-views="${viewText}" data-published="${published}">⋮</button>
            </div>
          `;
          // アバター画像がない場合はui-avatarsから取得
          if (!avatarUrl) {
            const avatarEl = card.querySelector('.channel-avatar');
            const img = document.createElement('img');
            img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(channel)}&background=random&color=fff&size=64&bold=true`;
            img.alt = channel;
            img.onload = () => img.classList.add('loaded');
            img.onerror = () => img.remove();
            avatarEl.appendChild(img);
          }
          videoGrid.appendChild(card);
        });

      } catch (err) {
        console.error("Fetch error", err);
      } finally {
        isFetching = false;
        loading.style.display = 'none';
      }
    }

    searchForm.onsubmit = (e) => {
      e.preventDefault();
      autocompleteDropdown.classList.remove('show');
      const q = searchInput.value.trim();
      if (!q) return;
      recordSearchHistory(q);
      currentQuery = q;
      currentPage = 0;
      isPersonalized = false;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      history.pushState(null, '', `/search?q=${encodeURIComponent(q)}`);
      loadContent(q, 0);
    };

    window.onscroll = () => {
      const scrollPos = window.innerHeight + window.scrollY;
      const threshold = document.documentElement.scrollHeight - 800;
      if (scrollPos >= threshold && !isFetching) {
        currentPage++;
        if (isPersonalized) {
          loadPersonalizedFeed(currentPage);
        } else {
          loadContent(currentQuery, currentPage);
        }
      }
    };

    document.getElementById('chipsBar').onclick = (e) => {
      const chip = e.target.closest('.chip');
      if (chip) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentPage = 0;
        searchInput.value = '';
        if (chip.dataset.q === 'recommended') {
          isPersonalized = true;
          loadPersonalizedFeed(0);
        } else {
          isPersonalized = false;
          currentQuery = chip.dataset.q;
          loadContent(currentQuery, 0);
        }
      }
    };

    // Sidebar link clicks
    document.querySelectorAll('.sidebar-item[data-q]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const q = item.dataset.q;
        if (!q) return;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        const matchingChip = document.querySelector(`.chip[data-q="${q}"]`);
        if (matchingChip) matchingChip.classList.add('active');
        currentPage = 0;
        searchInput.value = '';
        if (q === 'recommended') {
          isPersonalized = true;
          loadPersonalizedFeed(0);
        } else {
          isPersonalized = false;
          currentQuery = q;
          loadContent(q, 0);
        }
      });
    });

    // Settings
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const themeDark = document.getElementById('themeDark');
    const themeLight = document.getElementById('themeLight');
    const darkLabel = document.getElementById('darkLabel');
    const lightLabel = document.getElementById('lightLabel');

    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsPanel.classList.toggle('open');
    });
    settingsPanel.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', (e) => {
      if (!settingsBtn.contains(e.target)) settingsPanel.classList.remove('open');
    });

    function applyTheme(isLight) {
      if (isLight) {
        document.body.classList.add('light-mode');
        lightLabel.classList.add('selected'); darkLabel.classList.remove('selected');
        themeLight.checked = true;
      } else {
        document.body.classList.remove('light-mode');
        darkLabel.classList.add('selected'); lightLabel.classList.remove('selected');
        themeDark.checked = true;
      }
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }
    themeDark.addEventListener('change', () => { if (themeDark.checked) applyTheme(false); });
    themeLight.addEventListener('change', () => { if (themeLight.checked) applyTheme(true); });
    const savedTheme = localStorage.getItem('theme');
    applyTheme(savedTheme === 'light');

    // Playback
    const playbackMode = document.getElementById('playbackMode');
    const playbackHint = document.getElementById('playbackHint');
    const PLAYBACK_HINTS = {
      'googlevideo': 'Googlevideoのストリームで再生します（デフォルト）。',
      'youtube-nocookie': 'YouTube埋め込みプレイヤーで再生します（確実に動作します）。',
      'DL-Pro': 'DL-Proサーバー経由で360p相当のストリームを取得します。',
      'YoutubeEdu-Kahoot': 'Kahoot経由のYouTube教育プレイヤーで再生します。',
      'YoutubeEdu-Scratch': 'Scratch経由のYouTube教育プレイヤーで再生します。',
      'Youtube-Pro': 'Youtube-Proサーバー経由で再生します。',
      'Elixir-Network': 'Elixir-Networkプロキシ経由で再生します（ブロック回避に有効）。'
    };
    function applyPlaybackMode(mode) {
      playbackMode.value = mode;
      playbackHint.textContent = PLAYBACK_HINTS[mode] || PLAYBACK_HINTS.googlevideo;
      localStorage.setItem('playbackMode', mode);
    }
    playbackMode.addEventListener('change', () => applyPlaybackMode(playbackMode.value));
    applyPlaybackMode(localStorage.getItem('playbackMode') || 'googlevideo');

    // Thumbnail Server Settings
    const thumbServerSelect = document.getElementById('thumbServer');
    function applyThumbServer(mode) {
      thumbServerSelect.value = mode;
      localStorage.setItem('thumbServer', mode);
    }
    thumbServerSelect.addEventListener('change', () => {
      applyThumbServer(thumbServerSelect.value);
      location.reload();
    });
    applyThumbServer(localStorage.getItem('thumbServer') || 'default');

    const thumbHelpBtn = document.getElementById('thumbHelpBtn');
    if (thumbHelpBtn) {
      thumbHelpBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm('サムネイルが表示されないため、画像取得サーバーを「カスタムサーバー」に切り替えますか？')) {
          applyThumbServer('custom');
          location.reload();
        }
      });
    }

    // Autocomplete Logic
    const autocompleteDropdown = document.getElementById('autocompleteDropdown');
    let suggestScript = null;
    let autocompleteItems = [];
    let autocompleteSelectedIndex = -1;

    window.ytSuggestCallback = function(data) {
      const suggestions = data[1];
      renderAutocomplete(suggestions);
    };

    function fetchSuggestions(q) {
      if (!q.trim()) {
        autocompleteDropdown.classList.remove('show');
        return;
      }
      if (suggestScript) {
        suggestScript.remove();
      }
      suggestScript = document.createElement('script');
      suggestScript.src = `https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=${encodeURIComponent(q)}&jsonp=ytSuggestCallback`;
      document.body.appendChild(suggestScript);
    }

    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        fetchSuggestions(e.target.value);
      }, 150);
    });

    searchInput.addEventListener('focus', () => {
      if (searchInput.value.trim() && autocompleteDropdown.innerHTML.trim() !== '') {
        autocompleteDropdown.classList.add('show');
      }
    });

    document.addEventListener('click', (e) => {
      if (!searchForm.contains(e.target) && !autocompleteDropdown.contains(e.target)) {
        autocompleteDropdown.classList.remove('show');
      }
    });

    function renderAutocomplete(suggestions) {
      if (!suggestions || suggestions.length === 0) {
        autocompleteDropdown.classList.remove('show');
        return;
      }
      autocompleteItems = suggestions.map(s => s[0]);
      autocompleteSelectedIndex = -1;

      autocompleteDropdown.innerHTML = autocompleteItems.map((text, idx) => `
        <div class="autocomplete-item" data-idx="${idx}">
          <svg class="autocomplete-icon" viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
          <span>${text}</span>
        </div>
      `).join('');

      autocompleteDropdown.querySelectorAll('.autocomplete-item').forEach(item => {
        item.addEventListener('click', () => {
          searchInput.value = autocompleteItems[item.dataset.idx];
          autocompleteDropdown.classList.remove('show');
          searchForm.dispatchEvent(new Event('submit'));
        });
        item.addEventListener('mouseenter', () => {
          updateAutocompleteSelection(parseInt(item.dataset.idx));
        });
      });

      autocompleteDropdown.classList.add('show');
    }

    function updateAutocompleteSelection(index) {
      autocompleteSelectedIndex = index;
      const items = autocompleteDropdown.querySelectorAll('.autocomplete-item');
      items.forEach((item, idx) => {
        if (idx === index) item.classList.add('selected');
        else item.classList.remove('selected');
      });
    }

    searchInput.addEventListener('keydown', (e) => {
      if (!autocompleteDropdown.classList.contains('show')) return;

      const items = autocompleteDropdown.querySelectorAll('.autocomplete-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const nextIdx = (autocompleteSelectedIndex + 1) % items.length;
        updateAutocompleteSelection(nextIdx);
        searchInput.value = autocompleteItems[nextIdx];
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prevIdx = (autocompleteSelectedIndex - 1 + items.length) % items.length;
        updateAutocompleteSelection(prevIdx);
        searchInput.value = autocompleteItems[prevIdx];
      }
    });

    // Version
    async function fetchAndShowVersion() {
      try {
        const res = await fetch('/version');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.version) {
          const badge = document.getElementById('appVersion');
          const textEl = badge.querySelector('.version-badge-text');
          if (badge && textEl) {
            textEl.textContent = 'v' + data.version;
            badge.classList.add('show');
          }
        }
      } catch (e) {}
    }
    fetchAndShowVersion();

    // ===== パーソナライズ =====
    // チャンネル登録リストを取得
    function getSubscribedChannels() {
      const channels = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('subscribed_') && localStorage.getItem(key) === 'true') {
          channels.push(key.replace('subscribed_', ''));
        }
      }
      return channels;
    }

    // 閲覧履歴からキーワードを抽出（チャンネル名 + タイトルの主要語）
    function getHistoryKeywords() {
      const hist = libGet(LIB_HISTORY);
      const channels = [...new Set(hist.slice(0, 30).map(h => h.channel).filter(Boolean))];
      const titleWords = [];
      hist.slice(0, 20).forEach(h => {
        if (!h.title) return;
        // 短い語・記号を除いてキーワード抽出
        const words = h.title.replace(/[【】「」()!！?？\[\]#♪★☆◆◇]/g, ' ').split(/\s+/).filter(w => w.length >= 3);
        words.slice(0, 2).forEach(w => titleWords.push(w));
      });
      return { channels: channels.slice(0, 5), titleWords: [...new Set(titleWords)].slice(0, 8) };
    }

    // パーソナライズフィードを構築（登録チャンネル＋履歴キーワードで検索、シャッフル混合）
    async function loadPersonalizedFeed(page = 0) {
      if (isFetching) return;
      isFetching = true;
      loading.style.display = 'block';

      if (page === 0) {
        displayedIds.clear();
        videoGrid.innerHTML = '';
        shortsRow.innerHTML = '';
        shortsSection.style.display = 'none';
        shortsExpanded = true;
      }

      const subscribedChannels = getSubscribedChannels();
      const { channels: histChannels, titleWords } = getHistoryKeywords();

      // 登録チャンネルと履歴チャンネルを合算（重複除去）
      const allChannels = [...new Set([...subscribedChannels, ...histChannels])];
      const allKeywords = [...allChannels, ...titleWords];

      // キーワードがなければトレンドにフォールバック
      if (allKeywords.length === 0) {
        isFetching = false;
        loading.style.display = 'none';
        loadContent('trending', page);
        return;
      }

      try {
        // ページに応じてキーワードをローテーション（無限スクロール対応）
        const shuffled = shuffleArray([...allKeywords]);
        const pick = shuffled.slice((page % Math.max(shuffled.length, 1)) * 2, (page % Math.max(shuffled.length, 1)) * 2 + 3);
        const queries = pick.length > 0 ? pick : shuffled.slice(0, 3);

        const promises = queries.map(q => fetchEndpoint(`/api/search?q=${encodeURIComponent(q)}&page=${Math.floor(page / Math.max(queries.length, 1))}`));
        // トレンドも少し混ぜる（page=0のみ）
        if (page === 0) promises.push(fetchEndpoint(`/api/trending?page=0`));

        const results = await Promise.all(promises);
        let items = normalizeAndFilterList(results.flat());

        // 重複除去
        const seen = new Set([...displayedIds]);
        items = items.filter(it => { if (seen.has(it.id)) return false; seen.add(it.id); return true; });
        items = shuffleArray(items);

        if (items.length === 0 && page === 0) {
          videoGrid.innerHTML = '<p class="empty">動画が見つかりませんでした。</p>';
        }

        const shorts = [], normals = [];
        items.forEach(item => {
          if (!item || !item.id) return;
          if ((item.title || '').includes('#')) shorts.push(item);
          else normals.push(item);
        });

        // ショート表示（page=0のみ）
        if (page === 0 && shorts.length > 4) {
          shortsSection.style.display = 'block';
          shorts.forEach(item => {
            if (displayedIds.has(item.id)) return;
            displayedIds.add(item.id);
            const a = document.createElement('a');
            a.className = 'short-card';
            a.href = `/video/${item.id}`;
            const thumbUrl = getThumbUrl(item.id, 'hq');
            a.innerHTML = `
              <div class="short-thumb">
                <img src="${thumbUrl}" loading="lazy" alt="${item.title || 'ショート'}">
                <div class="short-overlay">
                  <div class="short-title">${item.title || ''}</div>
                  <div class="short-views">${item.viewCountText || ''}</div>
                </div>
              </div>
            `;
            shortsRow.appendChild(a);
          });
          updateShortsToggleUI();
        }

        normals.forEach(item => {
          if (!item || !item.id || displayedIds.has(item.id)) return;
          displayedIds.add(item.id);
          const card = document.createElement('a');
          card.className = 'video-card';
          card.href = `/video/${item.id}`;
          const thumbUrl = getThumbUrl(item.id, 'mq');
          const channel = item.channelTitle || '';
          const viewText = item.viewCountText || '';
          const published = item.publishedTimeText || '';
          const initial = channel ? channel[0].toUpperCase() : 'C';
          const avatarUrl = item.channelThumbnail || item.channelImage || '';
          const subKey = 'subscribed_' + channel;
          const isSub = localStorage.getItem(subKey) === 'true';
          card.innerHTML = `
            <div class="thumb">
              <img src="${thumbUrl}" loading="lazy" alt="${item.title || '動画'}">
              ${item.lengthText ? `<div class="duration-badge">${item.lengthText}</div>` : ''}
            </div>
            <div class="meta">
              <a href="/channel/${encodeURIComponent(channel)}" class="channel-avatar" data-initial="${initial}" onclick="event.stopPropagation()" style="text-decoration:none;">
                <span class="avatar-initial">${initial}</span>
                ${avatarUrl ? `<img src="${avatarUrl}" alt="${channel}" onload="this.classList.add('loaded')" onerror="this.remove()">` : ''}
              </a>
              <div class="details">
                <h3>${item.title || ''}</h3>
                <a href="/channel/${encodeURIComponent(channel)}" class="channel-name" onclick="event.stopPropagation()" style="text-decoration:none;color:var(--text-muted);">${channel}</a>
                <div class="video-stats">${viewText}${viewText && published ? ' • ' : ''}${published || item.publishedTimeText || ''}</div>
              </div>
              <button class="card-menu-btn" aria-label="メニュー" data-id="${item.id}" data-title="${(item.title||'').replace(/"/g,'&quot;')}" data-channel="${channel.replace(/"/g,'&quot;')}" data-views="${viewText}" data-published="${published}">⋮</button>
            </div>
          `;
          if (!avatarUrl) {
            const avatarEl = card.querySelector('.channel-avatar');
            const img = document.createElement('img');
            img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(channel)}&background=random&color=fff&size=64&bold=true`;
            img.alt = channel;
            img.onload = () => img.classList.add('loaded');
            img.onerror = () => img.remove();
            avatarEl.appendChild(img);
          }
          videoGrid.appendChild(card);
        });

      } catch (err) {
        console.error('Personalized feed error', err);
      } finally {
        isFetching = false;
        loading.style.display = 'none';
      }
    }

    // パーソナライズモードかどうか
    let isPersonalized = true;

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q');
      if (q) {
        currentQuery = q;
        searchInput.value = q;
        isPersonalized = false;
        loadContent(q, 0);
      } else {
        isPersonalized = true;
        loadPersonalizedFeed(0);
      }
    };

    // ===== LIBRARY: History / Liked / Playlists =====
    const LIB_HISTORY  = 'mt_history';
    const LIB_LIKED    = 'mt_liked';
    const LIB_PLAYLISTS = 'mt_playlists';
    const LIB_SEARCH_HISTORY = 'mt_search_history';
    const MAX_HISTORY  = 200;
    const MAX_SEARCH_HISTORY = 100;

    function libGet(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; } }
    function libSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

    // --- Search History ---
    function recordSearchHistory(query) {
      if (!query || !query.trim()) return;
      let sh = libGet(LIB_SEARCH_HISTORY);
      sh = sh.filter(x => x.query !== query.trim());
      sh.unshift({ query: query.trim(), ts: Date.now() });
      if (sh.length > MAX_SEARCH_HISTORY) sh = sh.slice(0, MAX_SEARCH_HISTORY);
      libSet(LIB_SEARCH_HISTORY, sh);
    }
    function removeSearchHistory(query) {
      libSet(LIB_SEARCH_HISTORY, libGet(LIB_SEARCH_HISTORY).filter(x => x.query !== query));
      openDrawer('searchHistory');
    }
    function clearSearchHistory() {
      if (confirm('検索履歴をすべて削除しますか？')) { libSet(LIB_SEARCH_HISTORY, []); openDrawer('searchHistory'); }
    }
    window.removeSearchHistory = removeSearchHistory;
    window.clearSearchHistory = clearSearchHistory;
    function recordHistory(item) {
      let hist = libGet(LIB_HISTORY);
      hist = hist.filter(h => h.id !== item.id);
      hist.unshift({ id: item.id, title: item.title, channel: item.channel, views: item.views, published: item.published, ts: Date.now() });
      if (hist.length > MAX_HISTORY) hist = hist.slice(0, MAX_HISTORY);
      libSet(LIB_HISTORY, hist);
    }

    // --- Liked ---
    function addLiked(item) {
      let liked = libGet(LIB_LIKED);
      if (liked.find(x => x.id === item.id)) {
        showToast('既に高評価済みです');
        return;
      }
      liked.unshift({ ...item, ts: Date.now() });
      libSet(LIB_LIKED, liked);
      showToast('高評価に追加しました 👍');
    }
    function removeLiked(id) {
      libSet(LIB_LIKED, libGet(LIB_LIKED).filter(x => x.id !== id));
      openDrawer('liked');
    }

    // --- Playlists ---
    function getPlaylists() { return libGet(LIB_PLAYLISTS); }
    function savePlaylists(pls) { libSet(LIB_PLAYLISTS, pls); }
    function addPlaylist(name) {
      const pls = getPlaylists();
      const pl = { id: Date.now().toString(), name, items: [], createdAt: Date.now() };
      pls.push(pl);
      savePlaylists(pls);
      return pl;
    }
    function deletePlaylist(plId) {
      savePlaylists(getPlaylists().filter(p => p.id !== plId));
    }
    function addToPlaylist(plId, item) {
      const pls = getPlaylists();
      const pl = pls.find(p => p.id === plId);
      if (!pl) return false;
      if (pl.items.find(x => x.id === item.id)) { showToast('既に追加済みです'); return false; }
      pl.items.push({ ...item, ts: Date.now() });
      savePlaylists(pls);
      return true;
    }
    function removeFromPlaylist(plId, itemId) {
      const pls = getPlaylists();
      const pl = pls.find(p => p.id === plId);
      if (pl) { pl.items = pl.items.filter(x => x.id !== itemId); savePlaylists(pls); }
    }
    function exportPlaylist(plId) {
      const pl = getPlaylists().find(p => p.id === plId);
      if (!pl) return;
      const blob = new Blob([JSON.stringify(pl, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `playlist_${pl.name.replace(/\s+/g,'_')}.json`;
      a.click();
    }

    // --- Toast ---
    let _toastTimer;
    function showToast(msg) {
      let t = document.getElementById('libToast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'libToast';
        t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:3000;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = '1';
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2500);
    }

    // --- Drawer ---
    let _drawerMode = null;
    let _drawerPlId = null;
    function openDrawer(mode, plId) {
      _drawerMode = mode;
      _drawerPlId = plId || null;
      const drawer = document.getElementById('libraryDrawer');
      const overlay = document.getElementById('drawerOverlay');
      const title = document.getElementById('drawerTitle');
      const body = document.getElementById('drawerBody');
      const titles = { history: '視聴履歴', searchHistory: '検索履歴', liked: '高評価した動画', playlists: '再生リスト', playlistDetail: '再生リスト' };
      title.textContent = titles[mode] || 'ライブラリ';
      body.innerHTML = '';
      if (mode === 'history') renderHistoryDrawer(body);
      else if (mode === 'searchHistory') renderSearchHistoryDrawer(body);
      else if (mode === 'liked') renderLikedDrawer(body);
      else if (mode === 'playlists') renderPlaylistsDrawer(body);
      else if (mode === 'playlistDetail') renderPlaylistDetail(body, plId);
      drawer.classList.add('open');
      overlay.classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('libraryDrawer').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('open');
    }

    function libItemHTML(item, removeFn) {
      return `<div style="display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;margin-bottom:4px;transition:background 0.1s;" onmouseenter="this.style.background='rgba(255,255,255,0.06)'" onmouseleave="this.style.background=''">
        <a href="/video/${item.id}" onclick="recordHistory(${JSON.stringify(item).replace(/</g,'\\u003c')})" style="display:flex;gap:12px;align-items:center;flex:1;text-decoration:none;color:inherit;min-width:0;">
          <div style="width:96px;min-width:96px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#1a1a1a;">
            <img src="${getThumbUrl(item.id, 'mq')}" style="width:100%;height:100%;object-fit:cover;display:block;" loading="lazy">
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;">${item.title || ''}</div>
            <div style="font-size:12px;color:var(--text-muted);">${item.channel || ''}${item.views ? ' • '+item.views : ''}</div>
          </div>
        </a>
        <button onclick="${removeFn}" style="background:none;border:none;color:var(--text-muted);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;" title="削除">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>`;
    }

    function renderSearchHistoryDrawer(body) {
      const sh = libGet(LIB_SEARCH_HISTORY);
      if (!sh.length) {
        body.innerHTML = `<div class="lib-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"><path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>検索履歴はまだありません</div>`;
        return;
      }
      const clearBtn = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button onclick="clearSearchHistory()" style="background:none;border:1px solid var(--border);color:var(--text-muted);padding:5px 12px;border-radius:6px;font-size:13px;cursor:pointer;">履歴をすべて削除</button></div>`;
      body.innerHTML = clearBtn + sh.map(item => {
        const dateStr = item.ts ? new Date(item.ts).toLocaleDateString('ja-JP', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
        const safeQuery = item.query.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `<div style="display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:10px;margin-bottom:2px;transition:background 0.1s;" onmouseenter="this.style.background='rgba(255,255,255,0.06)'" onmouseleave="this.style.background=''">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="flex-shrink:0;opacity:0.4;"><path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
          <div style="flex:1;min-width:0;cursor:pointer;" onclick="searchInput.value='${safeQuery}';autocompleteDropdown.classList.remove('show');recordSearchHistory('${safeQuery}');currentQuery='${safeQuery}';currentPage=0;isPersonalized=false;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));history.pushState(null,'','/search?q='+encodeURIComponent('${safeQuery}'));loadContent('${safeQuery}',0);closeDrawer();">
            <div style="font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.query}</div>
            ${dateStr ? `<div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${dateStr}</div>` : ''}
          </div>
          <button onclick="removeSearchHistory('${safeQuery}')" style="background:none;border:none;color:var(--text-muted);width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;" title="削除">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>`;
      }).join('');
    }

    function renderHistoryDrawer(body) {      const hist = libGet(LIB_HISTORY);
      if (!hist.length) { body.innerHTML = `<div class="lib-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"><path d="M13 3a9 9 0 1 0 0 18A9 9 0 0 0 13 3zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7zm.5-11H12v6l5.25 3.15.75-1.23-4.5-2.67V8z"/></svg>視聴履歴はまだありません</div>`; return; }
      const clearBtn = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button onclick="clearHistory()" style="background:none;border:1px solid var(--border);color:var(--text-muted);padding:5px 12px;border-radius:6px;font-size:13px;cursor:pointer;">履歴をすべて削除</button></div>`;
      body.innerHTML = clearBtn + hist.map(item => libItemHTML(item, `removeHistory('${item.id}')`)).join('');
    }
    function clearHistory() { if (confirm('視聴履歴をすべて削除しますか？')) { libSet(LIB_HISTORY, []); openDrawer('history'); } }
    function removeHistory(id) { libSet(LIB_HISTORY, libGet(LIB_HISTORY).filter(x => x.id !== id)); openDrawer('history'); }

    function renderLikedDrawer(body) {
      const liked = libGet(LIB_LIKED);
      if (!liked.length) { body.innerHTML = `<div class="lib-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>高評価した動画はまだありません</div>`; return; }
      body.innerHTML = liked.map(item => libItemHTML(item, `removeLiked('${item.id}')`)).join('');
    }
    window.removeLiked = removeLiked;
    window.removeHistory = removeHistory;

    function renderPlaylistsDrawer(body) {
      const pls = getPlaylists();
      const actRow = `<div class="drawer-action-row">
        <button class="btn-create-playlist" onclick="openCreatePl()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>新しい再生リスト
        </button>
      </div>`;
      if (!pls.length) {
        body.innerHTML = actRow + `<div class="lib-empty"><svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>再生リストはまだありません</div>`;
        return;
      }
      const cards = pls.map(pl => `
        <div class="playlist-card">
          <div class="playlist-card-header" onclick="openDrawer('playlistDetail','${pl.id}')">
            <div class="playlist-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg></div>
            <div>
              <div class="playlist-name">${pl.name}</div>
              <div class="playlist-count">${pl.items.length}本の動画</div>
            </div>
          </div>
          <div class="playlist-card-actions">
            <button class="btn-playlist-open" onclick="openDrawer('playlistDetail','${pl.id}')">開く</button>
            <button class="btn-playlist-export" onclick="exportPlaylist('${pl.id}')" title="JSONエクスポート">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> 書き出し
            </button>
            <button class="btn-playlist-delete" onclick="deletePlaylistUI('${pl.id}')">削除</button>
          </div>
        </div>`).join('');
      body.innerHTML = actRow + cards;
    }
    function deletePlaylistUI(plId) { if (confirm('この再生リストを削除しますか？')) { deletePlaylist(plId); openDrawer('playlists'); } }
    window.deletePlaylistUI = deletePlaylistUI;
    window.exportPlaylist = exportPlaylist;

          titles.push(title);

      // ============================================================
      //  2. UTILITIES

      const $ = (id) => document.getElementById(id);

      function safeGet(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
        catch { return fallback; }
      }
      function safeSet(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
      }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function pickRandom(arr, n) {
        return shuffle(arr).slice(0, n);
      }
      function isShortItem(item) {
        // 既存と同じルール: タイトルに'#'を含む = ショート扱い
        return (item && item.title && String(item.title).includes('#'));
      }
      function normalizeIdList(list) {
        const out = [];
        for (const it of (list || [])) {
          if (!it) continue;
          let id = null;
          if (typeof it.id === 'string') id = it.id;
          else if (it.id && typeof it.id === 'object') id = it.id.videoId || it.id.channelId || it.id.playlistId || it.id;
          else if (it.videoId) id = it.videoId;
          if (!id) continue;
          id = String(id);
          if (id.startsWith('UC')) continue;
          it.id = id;
          out.push(it);
        }
        return out;
      }
      function getSubscribedChannelsLocal() {
        const channels = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('subscribed_') && localStorage.getItem(key) === 'true') {
            channels.push(key.replace('subscribed_', ''));
          }
        }
        return channels;
      }
      function getThumbForId(id) {
        try { return getThumbUrl(id, 'hq'); }
        catch { return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }
      }
      // タイトル類似度(jaccardベース・簡易) - 同一タイトル乱発を防ぐ
      function tokensFromTitle(t) {
        return String(t || '').toLowerCase()
          .replace(/[【】「」『』()（）!！?？\[\]#♪★☆◆◇\.,、。:：;；\-_/\\|]/g, ' ')
          .split(/\s+/)
          .filter(w => w.length >= 2);
      }
      function jaccard(aTokens, bTokens) {
        if (!aTokens.length || !bTokens.length) return 0;
        const A = new Set(aTokens), B = new Set(bTokens);
        let inter = 0;
        A.forEach(x => { if (B.has(x)) inter++; });
        return inter / (A.size + B.size - inter);
      }

      // ============================================================
      //  3. GROQ API (3キー ランダムローテーション + リトライ)
      // ============================================================
      let groqLastFailedKeyIdx = -1;
      async function callGroq(messages, opts = {}) {
        // 1キー無料枠が厳しいので、毎回シャッフル
        const order = shuffle(GROQ_KEYS.map((_, i) => i));
        const modelList = opts.models || GROQ_MODELS;
        let lastErr = null;
        for (const idx of order) {
          if (idx === groqLastFailedKeyIdx) continue; // 直前に失敗したのは後回し
          for (const model of modelList) {
            try {
              const ctrl = new AbortController();
              const to = setTimeout(() => ctrl.abort(), opts.timeout || 12000);
              const res = await fetch(GROQ_URL, {
                method: 'POST',
                signal: ctrl.signal,
                headers: {
                  'Authorization': `Bearer ${GROQ_KEYS[idx]}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  model,
                  messages,
                  temperature: opts.temperature ?? 0.6,
                  max_tokens: opts.max_tokens ?? 400
                })
              });
              clearTimeout(to);
              if (!res.ok) {
                if (res.status === 429 || res.status === 401 || res.status === 403) {
                  groqLastFailedKeyIdx = idx;
                }
                lastErr = new Error(`Groq ${res.status}`);
                continue;
              }
              const data = await res.json();
              const txt = data?.choices?.[0]?.message?.content || '';
              if (txt) return txt;
            } catch (e) { lastErr = e; }
          }
        }
        // 全失敗
        throw lastErr || new Error('Groq all keys failed');
      }

      // ============================================================
      //  7. AI ジャンル拡張 (履歴のキーワードを「広いジャンル」に拡張)
      // ============================================================
      async function aiExpandGenres(seedKeywords) {
        // キャッシュ
        const cache = safeGet(KEY_AI_GENRE_CACHE, null);
        const seedKey = JSON.stringify(seedKeywords.slice(0, 8).sort());
        if (cache && cache.key === seedKey && cache.ts && (Date.now() - cache.ts) < CACHE_TTL_GENRE) {
          return cache.genres;
        }
        if (!seedKeywords.length) return [];
        const sys = "あなたはYouTube動画のジャンル分析AIです。ユーザーの過去の視聴データから、その人が『新しく好きになりそうな関連ジャンル・関連トピック』を予測します。";
        const userMsg =
          "以下はユーザーの最近の視聴タイトルとチャンネルです:\n" +
          seedKeywords.slice(0, 12).map(s => `- ${s}`).join('\n') +
          "\n\nこのユーザーに『おすすめする YouTube 検索ジャンル・関連トピック』を10個、" +
          "1行に1つ、日本語または英語の短い検索ワード(2〜6語)で出力してください。" +
          "重要: 入力タイトルそのものをコピーしないで、より広いジャンルや関連トピックに拡張してください。" +
          "出力は箇条書きや番号なしで、各行に1個ずつ。前置きや説明は一切不要。";
        try {
          const raw = await callGroq([
            { role: 'system', content: sys },
            { role: 'user', content: userMsg }
          ], { temperature: 0.7, max_tokens: 300 });
          const lines = raw.split(/\r?\n/).map(s => s.replace(/^[\s\-\*\d+.)]+/, '').trim())
            .filter(s => s.length >= 2 && s.length <= 40)
            .slice(0, 10);
          safeSet(KEY_AI_GENRE_CACHE, { key: seedKey, ts: Date.now(), genres: lines });
          return lines;
        } catch (e) {
          console.warn('[MIN-Pro-AI] genre expand failed', e);
          return [];
        }
      }

      // ============================================================
      //  8. 履歴シグナル抽出 (重み付き・最新ほど高い)
      // ============================================================
      function getHistorySignals() {
        const hist = safeGet(LIB_HISTORY, []);
        const liked = safeGet(LIB_LIKED, []);
        const subs = getSubscribedChannelsLocal();

        // チャンネル別 重み(最新ほど高い)
        const channelWeight = new Map();
        hist.slice(0, 50).forEach((h, i) => {
          if (!h.channel) return;
          const w = 1 / (1 + i * 0.08);
          channelWeight.set(h.channel, (channelWeight.get(h.channel) || 0) + w);
        });
        liked.slice(0, 30).forEach(h => {
          if (!h.channel) return;
          channelWeight.set(h.channel, (channelWeight.get(h.channel) || 0) + 1.2);
        });
        subs.forEach(c => channelWeight.set(c, (channelWeight.get(c) || 0) + 2));

        // ソート済みチャンネル
        const topChannels = Array.from(channelWeight.entries())
          .sort((a, b) => b[1] - a[1])
          .map(([c]) => c);

        // タイトルキーワード (重みつき)
        const wordWeight = new Map();
        hist.slice(0, 35).forEach((h, i) => {
          if (!h.title) return;
          const words = tokensFromTitle(h.title).filter(w => w.length >= 3);
          const w = 1 / (1 + i * 0.06);
          words.slice(0, 4).forEach(word => {
            wordWeight.set(word, (wordWeight.get(word) || 0) + w);
          });
        });
        const topWords = Array.from(wordWeight.entries())
          .sort((a, b) => b[1] - a[1])
          .slice(0, 12)
          .map(([w]) => w);

        // 履歴の全タイトル (類似度排除用)
        const historyTitles = hist.slice(0, 100).map(h => tokensFromTitle(h.title));
        const historyIds = new Set(hist.map(h => h.id).filter(Boolean));

        return { topChannels, topWords, historyTitles, historyIds, hist, liked, subs };
      }

      // ============================================================
      //  9. THE NEW RECOMMENDATION ENGINE
      //     loadPersonalizedFeedV2(page)
      //     - 履歴源 + 発見源 を 50:50 でインターリーブ
      //     - 同一タイトル排除 (jaccard類似度 >= 0.7 を除外)
      //     - 視聴済みも軽く混ぜる(2割)
      // ============================================================
      const _displayedTitleTokens = []; // セッション内重複防止
      let _v2State = {
        recentlyShownChannels: new Map(),    // 連続表示防止
        page: 0
      };
      function tooSimilarToShown(titleTokens, threshold = 0.7) {
        for (const ex of _displayedTitleTokens) {
          if (jaccard(titleTokens, ex) >= threshold) return true;
        }
        return false;
      }

      // メイン: ページ呼び出しで使う
      async function loadPersonalizedFeedV2(page = 0) {
        if (typeof window.isFetching !== 'undefined' && window.isFetching) return;
        // 既存のグローバル isFetching を利用
        try { window.isFetching = true; } catch {}

        try {
          if (page === 0) {
            // reset
            _displayedTitleTokens.length = 0;
            _v2State.recentlyShownChannels.clear();
            window.displayedIds && window.displayedIds.clear && window.displayedIds.clear();
            if (videoGrid) videoGrid.innerHTML = '';
            // hide shorts area initially
            const ss = document.getElementById('shortsSection');
            const sr = document.getElementById('shortsRow');
            if (ss) ss.style.display = 'none';
            if (sr) sr.innerHTML = '';
          }

          if (page === 0) {
            // show skeleton
            showSkeletons(12);
          } else if (loading) {
            loading.classList.add('mpx-active');
            loading.style.display = 'flex';
            loading.textContent = '次のおすすめを取得中...';
          }

          const signals = getHistorySignals();
          const hasHistory = signals.hist.length > 0 || signals.liked.length > 0 || signals.subs.length > 0;

          // ----- BUILD SOURCES -----
          // ソース A: 履歴系 (チャンネル + タイトルキーワード)
          // ソース B: 発見系 (AIジャンル拡張 + トレンド + おすすめチップ)
          //
          // page=0: AIジャンル拡張を呼ぶ(キャッシュ)
          //         以降のページはキャッシュ利用
          let aiGenres = [];
          if (hasHistory) {
            const seeds = [
              ...signals.topChannels.slice(0, 6),
              ...signals.topWords.slice(0, 6)
            ];
            // AIは並列で走らせる(失敗してもOK)
            aiGenres = await aiExpandGenres(seeds);
          }

          // チップから「他のジャンル」を取ってきて発見源にする
          const chipsAll = Array.from(document.querySelectorAll('.chip'))
            .map(c => c.dataset.q)
            .filter(q => q && q !== 'recommended' && q !== 'shorts');

          // 履歴ソース クエリ
          const personalQueries = [];
          // チャンネル名 (Top 1〜2 を採用)
          signals.topChannels.slice(0, 2).forEach(c => personalQueries.push(c));
          // 重みつきキーワード (Top 3〜4) - ページ番号でローテーション
          const pwords = signals.topWords;
          if (pwords.length > 0) {
            const startIdx = (page * 2) % Math.max(pwords.length, 1);
            for (let k = 0; k < 3 && k < pwords.length; k++) {
              personalQueries.push(pwords[(startIdx + k) % pwords.length]);
            }
          }

          // 発見ソース クエリ
          const discoveryQueries = [];
          if (aiGenres.length > 0) {
            // AIジャンルから 2〜3 個ローテで採用
            const startIdx = (page * 2) % aiGenres.length;
            for (let k = 0; k < 3; k++) {
              discoveryQueries.push(aiGenres[(startIdx + k) % aiGenres.length]);
            }
          }
          // チップからランダム1〜2個も追加
          pickRandom(chipsAll, 2).forEach(c => discoveryQueries.push(c));

          // ----- FETCH IN PARALLEL -----
          const fetchPromises = [];
          const sourceMap = []; // index -> 'personal' | 'discover' | 'trend'

          personalQueries.forEach(q => {
            fetchPromises.push(apiSearch(q, Math.floor(page / 2)));
            sourceMap.push({ src: 'personal', q });
          });
          discoveryQueries.forEach(q => {
            fetchPromises.push(apiSearch(q, Math.floor(page / 2)));
            sourceMap.push({ src: 'discover', q });
          });
          // page 0 はトレンドも混ぜる
          if (page === 0) {
            fetchPromises.push(apiTrending(0));
            sourceMap.push({ src: 'trend', q: 'trending' });
          }

          // 履歴がなければ純粋にトレンド+チップで構成
          if (!hasHistory) {
            // fallback: 既存の loadContent 'trending' へ
            try { window.isFetching = false; } catch {}
            clearSkeletons();
            if (loading) { loading.classList.remove('mpx-active'); loading.style.display = 'none'; }
            if (typeof window.__origLoadContent === 'function') {
              return window.__origLoadContent('trending', page);
            }
            return;
          }

          const results = await Promise.all(fetchPromises);

          // タグつき item リスト
          const taggedItems = [];
          results.forEach((arr, i) => {
            const meta = sourceMap[i];
            (arr || []).forEach(it => {
              if (!it || !it.id) return;
              taggedItems.push({ item: it, src: meta.src, q: meta.q });
            });
          });

          // 重複ID排除 (このセッションで既出)
          const displayedIds = window.displayedIds instanceof Set ? window.displayedIds : new Set();
          const seenIds = new Set([...displayedIds]);

          const personalList = [];
          const discoverList = [];
          const watchedAgainList = []; // 履歴に含まれるが軽く混ぜる候補

          for (const { item, src } of taggedItems) {
            if (!item || !item.id) continue;
            if (seenIds.has(item.id)) continue;
            seenIds.add(item.id);

            // 視聴済み判定
            if (signals.historyIds.has(item.id)) {
              if (Math.random() < 0.10) {
                watchedAgainList.push(item);  // 10%だけ「もう一度どうぞ」として混ぜる
              }
              continue;
            }

            // 類似度フィルター: 直近表示済みタイトルと70%以上重なるものは除外
            const tokens = tokensFromTitle(item.title);
            if (tokens.length >= 2 && tooSimilarToShown(tokens, 0.75)) continue;
            // 履歴と95%以上一致する(完全同タイトル)も除外
            let dup = false;
            for (const hT of signals.historyTitles) {
              if (jaccard(tokens, hT) >= 0.92) { dup = true; break; }
            }
            if (dup) continue;

            (src === 'personal' ? personalList : discoverList).push(item);
            _displayedTitleTokens.push(tokens);
          }

          // ----- INTERLEAVE 1:1 (Personal : Discover) -----
          // ユーザーは「視聴履歴一色」を嫌うので、純粋に交互配置
          const personalShuffled = shuffle(personalList);
          const discoverShuffled = shuffle(discoverList);
          const watchedShuffled = shuffle(watchedAgainList);

          const merged = [];
          // 50:50
          const half = Math.max(personalShuffled.length, discoverShuffled.length);
          for (let i = 0; i < half; i++) {
            // ページ番号で開始順を入れ替え(偶数ページは履歴始まり、奇数ページは発見始まり)
            if (page % 2 === 0) {
              if (i < personalShuffled.length) merged.push({ item: personalShuffled[i], src: 'personal' });
              if (i < discoverShuffled.length) merged.push({ item: discoverShuffled[i], src: 'discover' });
            } else {
              if (i < discoverShuffled.length) merged.push({ item: discoverShuffled[i], src: 'discover' });
              if (i < personalShuffled.length) merged.push({ item: personalShuffled[i], src: 'personal' });
            }
          }
          // 視聴済みリピートを薄く差し込む
          watchedShuffled.slice(0, Math.max(1, Math.floor(merged.length * 0.06))).forEach((it, idx) => {
            const pos = Math.min(merged.length, 6 + idx * 5);
            merged.splice(pos, 0, { item: it, src: 'rewatch' });
          });

          // 連続同チャンネル制限 (3個以上連続したら次のを後ろに送る)
          const finalList = [];
          let lastCh = null, lastChStreak = 0;
          const queue = merged.slice();
          while (queue.length > 0) {
            const taken = queue.shift();
            const ch = taken.item.channelTitle || '';
            if (ch && ch === lastCh && lastChStreak >= 2) {
              // 後ろに退避(後ろにも候補がなければ追加する)
              const swap = queue.findIndex(x => (x.item.channelTitle || '') !== lastCh);
              if (swap >= 0) {
                queue.splice(swap, 0, taken);
                continue;
              }
            }
            finalList.push(taken);
            if (ch === lastCh) lastChStreak++;
            else { lastCh = ch; lastChStreak = 1; }
          }

          // ----- SHORTS HANDLING (既存ロジックを尊重) -----
          // ショート判定 = タイトルに'#'
          const shortsList = [];
          const normals = [];
          finalList.forEach(({ item, src }) => {
            if (isShortItem(item)) shortsList.push({ item, src });
            else normals.push({ item, src });
          });

          if (page === 0 && shortsList.length > 4) {
            const ss = document.getElementById('shortsSection');
            const sr = document.getElementById('shortsRow');
            if (ss && sr) {
              ss.style.display = 'block';
              shortsList.forEach(({ item }) => {
                if (displayedIds.has(item.id)) return;
                displayedIds.add(item.id);
                const a = document.createElement('a');
                a.className = 'short-card';
                a.href = `/video/${item.id}`;
                const thumbUrl = getThumbForId(item.id);
                a.innerHTML = `
                  <div class="short-thumb">
                    <img src="${thumbUrl}" loading="lazy" alt="${escapeAttr(item.title || 'ショート')}">
                    <div class="short-overlay">
                      <div class="short-title">${escapeHtmlText(item.title || '')}</div>
                      <div class="short-views">${escapeHtmlText(item.viewCountText || '')}</div>
                    </div>
                  </div>`;
                sr.appendChild(a);
              });
              if (typeof updateShortsToggleUI === 'function') {
                try { updateShortsToggleUI(); } catch {}
              }
            }
          }

          // ----- BUILD MYMIX SLOTS (ホームの動画と混在) -----
          let mymixSlots = [];
          if (page === 0) {
            // プレースホルダーを最初に挿入、後で実体に置き換える
            mymixSlots = MyMIX.scheduleSlotsForGrid(signals);
          }

          // ----- RENDER -----
          if (page === 0) clearSkeletons();
          renderVideoCards(normals, page, mymixSlots, displayedIds);

          // MyMIX の非同期構築(プレースホルダー -> 実体)
          if (page === 0 && mymixSlots.length > 0) {
            MyMIX.fillSlotsAsync(mymixSlots, signals);
          }

        } catch (err) {
          console.error('[MIN-Pro-AI] feed v2 error:', err);
          // フォールバック: 既存
          try {
            clearSkeletons();
            if (typeof window.__origLoadContent === 'function') {
              await window.__origLoadContent('trending', page);
            }
          } catch {}
        } finally {
          try { window.isFetching = false; } catch {}
          if (loading) {
            loading.classList.remove('mpx-active');
            loading.style.display = 'none';
            loading.textContent = '';
          }
        }
      }

      function escapeHtmlText(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      function escapeAttr(s) {
        return escapeHtmlText(s).replace(/"/g, '&quot;');
      }

      // ============================================================
      // 10. CARD RENDERING v2 (2段階チャンクレンダリング)
      //     - DocumentFragment で一括 append (レイアウトスラッシング防止)
      //     - 1チャンク = 8枚; 中間で requestAnimationFrame を振る (ブロックしない)
      //     - ページ応答停止を絶対に防ぐ
      // ============================================================
      function renderVideoCards(taggedList, page, mymixSlots, displayedIdsSet) {
        if (!videoGrid) return;
        const mixPositions = mymixSlots.map(s => s.position);
        const CHUNK = 8;

        // まず Stage 1: 最初の CHUNK 枚を sync で表示 (UXの即時フィードバック)
        // Stage 2 以降は rAF チェーンでバッチ処理
        let cardIdx = 0;
        let listIdx = 0;

        function makeMixPlaceholder(slot) {
          const ph = document.createElement('div');
          ph.className = 'video-card mpx-mymix-placeholder';
          ph.dataset.mixSlot = slot.id;
          ph.innerHTML = `
            <div class="mpx-mix-loading-card">
              <div class="mpx-mxl-content">
                <div class="mpx-mxl-dots"><span></span><span></span><span></span></div>
                <div class="mpx-mxl-text">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2 9.5 8.5 3 11l6.5 2.5L12 20l2.5-6.5L21 11l-6.5-2.5z"/></svg>
                  MyMIX を収集中...
                </div>
              </div>
            </div>
            <div class="meta">
              <div class="mpx-skel-avatar" style="width:36px;height:36px;border-radius:50%;"></div>
              <div class="mpx-skel-lines" style="flex:1;display:flex;flex-direction:column;gap:6px;">
                <div class="mpx-skel-line long"></div>
                <div class="mpx-skel-line short"></div>
              </div>
            </div>`;
          return ph;
        }

        function buildOneChunk(maxCount) {
          const frag = document.createDocumentFragment();
          let appended = 0;
          while (appended < maxCount && listIdx < taggedList.length) {
            // MyMIX スロットを位置にヒットしたら挿入
            if (page === 0 && mixPositions.includes(cardIdx) && mymixSlots.length > 0) {
              const slot = mymixSlots.shift();
              const pi = mixPositions.indexOf(cardIdx);
              if (pi >= 0) mixPositions.splice(pi, 1);
              frag.appendChild(makeMixPlaceholder(slot));
              cardIdx++; appended++;
              continue;
            }
            const { item, src } = taggedList[listIdx];
            listIdx++;
            if (!item || !item.id || displayedIdsSet.has(item.id)) continue;
            displayedIdsSet.add(item.id);
            try {
              const card = buildRegularCard(item, src, signalsCache);
              frag.appendChild(card);
            } catch (err) {
              console.warn('[render] card err:', err);
              continue;
            }
            cardIdx++; appended++;
          }
          if (frag.childNodes.length > 0) videoGrid.appendChild(frag);
          return appended > 0;
        }

        // Stage 1: 即時表示
        buildOneChunk(CHUNK);

        // Stage 2: 残りを rAF チェーン (ページ応答をブロックしない)
        function tick() {
          if (listIdx >= taggedList.length && mixPositions.length === 0) return;
          const startedAt = performance.now();
          while (listIdx < taggedList.length && performance.now() - startedAt < 8) {
            const did = buildOneChunk(CHUNK);
            if (!did) break;
          }
          if (listIdx < taggedList.length) {
            requestAnimationFrame(tick);
          }
        }
        if (listIdx < taggedList.length) requestAnimationFrame(tick);
      }

      let signalsCache = null;
      function buildRegularCard(item, src, signals) {
        const card = document.createElement('a');
        card.className = 'video-card mpx-fade-in';
        card.href = `/video/${item.id}`;
        const thumbUrl = getThumbForId(item.id);
        const channel = item.channelTitle || '';
        const viewText = item.viewCountText || '';
        const published = item.publishedTimeText || '';
        const initial = channel ? channel[0].toUpperCase() : 'C';
        const avatarUrl = item.channelThumbnail || item.channelImage || '';
        const isWatched = signals && signals.historyIds && signals.historyIds.has(item.id);

        card.innerHTML = `
          <div class="thumb">
            <img src="${thumbUrl}" loading="lazy" alt="${escapeAttr(item.title || '動画')}">
            ${item.lengthText ? `<div class="duration-badge">${escapeHtmlText(item.lengthText)}</div>` : ''}
            ${isWatched ? `<div class="mpx-watched-chip">視聴済み</div>` : ''}
            ${src === 'rewatch' ? `<div class="mpx-ai-source-badge" style="background:rgba(255,179,71,.9)">🔁 もう一度</div>` : ''}
          </div>
          <div class="meta">
            <a href="/channel/${encodeURIComponent(channel)}" class="channel-avatar" data-initial="${escapeAttr(initial)}" onclick="event.stopPropagation()" style="text-decoration:none;">
              <span class="avatar-initial">${escapeHtmlText(initial)}</span>
              ${avatarUrl ? `<img src="${escapeAttr(avatarUrl)}" alt="${escapeAttr(channel)}" onload="this.classList.add('loaded')" onerror="this.remove()">` : ''}
            </a>
            <div class="details">
              <h3>${escapeHtmlText(item.title || '')}</h3>
              <a href="/channel/${encodeURIComponent(channel)}" class="channel-name" onclick="event.stopPropagation()" style="text-decoration:none;color:var(--text-muted);">${escapeHtmlText(channel)}</a>
              <div class="video-stats">${escapeHtmlText(viewText)}${viewText && published ? ' • ' : ''}${escapeHtmlText(published || '')}</div>
            </div>
            <button class="card-menu-btn" aria-label="メニュー"
              data-id="${escapeAttr(item.id)}"
              data-title="${escapeAttr(item.title || '')}"
              data-channel="${escapeAttr(channel)}"
              data-views="${escapeAttr(viewText)}"
              data-published="${escapeAttr(published)}">⋮</button>
          </div>`;
        if (!avatarUrl) {
          const avatarEl = card.querySelector('.channel-avatar');
          const img = document.createElement('img');
          img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(channel)}&background=random&color=fff&size=64&bold=true`;
          img.alt = channel;
          img.onload = () => img.classList.add('loaded');
          img.onerror = () => img.remove();
          avatarEl.appendChild(img);
        }
        return card;
      }

      // ============================================================
      // 11. MyMIX REMOVED (replaced with no-op stub on user's request)
      //     全機能の引数は維持し、戻り値は空配列のみ返す
      // ============================================================
      const MyMIX = (function () {
        function scheduleSlotsForGrid(_signals) { return []; }
        async function fillSlotsAsync(_slots, _signals) { return; }
        function buildMyMixCard(_slot, _videos) { return null; }
        // 古いキャッシュもクリーンアップ
        try {
          localStorage.removeItem('mt_mymix_v2');
          localStorage.removeItem('mt_mymix');
        } catch {}
        return { scheduleSlotsForGrid, fillSlotsAsync, buildMyMixCard };
      })();

      // tokensFromTitleLite を MyMIX や MIN-AI 両方で使うため、クロージャスコープ上位に見えるよう面倒を見るヘルパー
      function tokensFromTitleLite(t) {
        return String(t || '').toLowerCase()
          .replace(/[\u3010\u3011\u300c\u300d\u300e\u300f\(\)\uff08\uff09!\uff01?\uff1f\[\]#\u266a\u2605\u2606\u25c6\u25c7\.,\u3001\u3002:\uff1a;\uff1b\-_\/\\|]/g, ' ')
          .split(/\s+/)
          .filter(w => w.length >= 2);
      }

      // ============================================================
      // 12. MyMIX PLAYER REMOVED (kept stub for safety)
      // ============================================================
      function openMixPlayer(_slot, _items) { /* removed */ }

      // ============================================================
      // 13. WRAP EXISTING window.onload / loadPersonalizedFeed / loadContent
      // ============================================================
      // 既存をバックアップ
      window.__origLoadPersonalizedFeed = window.loadPersonalizedFeed || null;
      window.__origLoadContent = window.loadContent || null;

      // signals を render側で参照できるようにグローバル更新
      function refreshSignalsCache() {
        try { signalsCache = getHistorySignals(); } catch { signalsCache = null; }
      }
      refreshSignalsCache();

      // 上書き: パーソナライズフィードの呼び出しを v2 に置き換え
      // ただし元関数も呼び出し可能なまま (__origLoadPersonalizedFeed)
      window.loadPersonalizedFeed = async function (page = 0) {
        refreshSignalsCache();
        return loadPersonalizedFeedV2(page);
      };

      // loadContent ラッパー: スケルトンを「内部の innerHTML='' 後」にも維持する
      // 元 loadContent は内部で videoGrid.innerHTML = '' するが、その直後に
      // MutationObserver でスケルトンを瞬時に再注入 -> 最初のリアルカードが
      // appendChild されるまで保持。リアルカードが入ったらスケルトンを除去。
      if (typeof window.loadContent === 'function') {
        const __origLC = window.loadContent;
        window.loadContent = function (query, page = 0) {
          let mo = null;
          let skeletonInserted = false;
          let firstCardSeen = false;
          try {
            if (page === 0 && videoGrid) {
              showSkeletons(8);
              skeletonInserted = true;
              // 内部の innerHTML='' でスケルトンが消えた瞬間に再注入し、
              // 実体カードが現れたら除去する
              mo = new MutationObserver(() => {
                if (!videoGrid) return;
                const hasSkel = videoGrid.querySelector('.mpx-skeleton-card');
                const hasReal = videoGrid.querySelector('.video-card:not(.mpx-skeleton-card):not(.mpx-mymix-placeholder)');
                if (hasReal && !firstCardSeen) {
                  firstCardSeen = true;
                  // 実体来た -> スケルトン除去 & 監視終了
                  videoGrid.querySelectorAll('.mpx-skeleton-card').forEach(el => el.remove());
                  mo && mo.disconnect();
                  return;
                }
                if (!hasSkel && !hasReal && skeletonInserted && !firstCardSeen) {
                  // 空になった: 再注入
                  showSkeletons(8);
                }
              });
              mo.observe(videoGrid, { childList: true });
              // 安全弁: 12秒で必ず監視終了
              setTimeout(() => {
                try {
                  mo && mo.disconnect();
                  videoGrid && videoGrid.querySelectorAll('.mpx-skeleton-card').forEach(el => el.remove());
                } catch {}
              }, 12000);
            }
          } catch (e) { console.warn('[MIN-Pro-AI] loadContent wrap err:', e); }
          let p;
          try { p = __origLC(query, page); } catch (e) { console.warn(e); p = Promise.resolve(); }
          // Promise であってもなくても、終わったら確実にスケルトン除去

      // 履歴タイトルから"ジャンルクラスタ"を抽出 (頻出 token 群)
      function buildHistoryGenreCluster(signals) {
        try {
          const hist = (signals && signals.hist) || [];
          const liked = (signals && signals.liked) || [];
          const tokenFreq = new Map();
          const channelGenres = new Map(); // channel -> top token set

          const addTokens = (text, weight) => {

              .filter(w => w.length >= 2 && w.length <= 25)

          });
          liked.slice(0, 25).forEach(h => {

          });

          // ノイズワード除去
          const noise = new Set(['the','and','for','with','from','this','that','official','video','music','mv','ft','feat','vol','part','full','live','hd','4k','live','tv','ch','channel','ver','ver.','version']);
          const sorted = Array.from(tokenFreq.entries())
            .filter(([w]) => !noise.has(w))
            .sort((a, b) => b[1] - a[1]);

          const coreTokens = new Set(sorted.slice(0, 20).map(([w]) => w));
          return { coreTokens, channelGenres, sorted };
        } catch {
          return { coreTokens: new Set(), channelGenres: new Map(), sorted: [] };
        }
      }

      function tokensFromTitleLite(t) {
        return String(t || '').toLowerCase()

          .split(/\s+/)
          .filter(w => w.length >= 2);
      }

      function genreOverlapScore(itemTokens, coreTokens) {
        if (!itemTokens || !itemTokens.length || !coreTokens || !coreTokens.size) return 0;
        let hits = 0;
        for (const t of itemTokens) if (coreTokens.has(t)) hits++;

          const B = new Set(ref);
          if (!A.size || !B.size) continue;
          let inter = 0;
          A.forEach(x => { if (B.has(x)) inter++; });
          const jacc = inter / (A.size + B.size - inter);
          if (jacc >= threshold) return true;
        }
        return false;

      function looksLikeCopyOrSpam(item, signals) {
        const title = String(item.title || '').toLowerCase();
        const ch = String(item.channelTitle || '').toLowerCase();
        // 既存履歴と完全/ほぼ同タイトルで"チャンネルが違う"のは多分コピー動画
        const itTokens = tokensFromTitleLite(title);
        for (const h of (signals.hist || []).slice(0, 30)) {
          const ht = tokensFromTitleLite(h.title);
          if (!ht.length) continue;
          const A = new Set(itTokens), B = new Set(ht);
