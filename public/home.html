
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#070709"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="color-scheme" content="dark"/>
<title>NyxOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NyxOS — Dark Incognito × Win11 Tabs × macOS Dock
   ============================================================ */
:root{
  --bg-0:#070709;
  --bg-1:#0d0d12;
  --bg-2:#14141b;
  --bg-3:#1c1c26;
  --bg-glass:rgba(18,18,26,.68);
  --bg-glass-strong:rgba(12,12,18,.82);
  --bg-glass-ultra:rgba(8,8,14,.92);
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.13);
  --border-glow:rgba(124,92,255,.25);
  --text:#f6f6fa;
  --text-dim:#a8a8b8;
  --text-mute:#6e6e7c;
  --accent:#8b6fff;
  --accent-2:#6a9cff;
  --accent-3:#ff7ab8;
  --accent-glow:rgba(139,111,255,.5);
  --accent-soft:rgba(139,111,255,.12);
  --danger:#ff5a6a;
  --warn:#ffb347;
  --ok:#3ddc97;
  --radius-xl:22px;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-xl:0 40px 100px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.04), 0 0 60px -10px rgba(139,111,255,.08);
  --shadow-lg:0 24px 60px -16px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.04);
  --shadow-md:0 12px 30px -10px rgba(0,0,0,.6);
  --shadow-sm:0 4px 12px -2px rgba(0,0,0,.5);
  --shadow-glow:0 0 40px -8px var(--accent-glow);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --ease-smooth:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:'Inter','SF Pro Display','Segoe UI',-apple-system,sans-serif;
  background:var(--bg-0);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ====== Animated Background ====== */
.bg-layer{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(1400px 700px at 12% 8%, rgba(139,111,255,.10), transparent 60%),
    radial-gradient(1000px 600px at 88% 92%, rgba(106,156,255,.08), transparent 60%),
    radial-gradient(800px 500px at 50% 50%, rgba(255,122,184,.025), transparent 70%),
    linear-gradient(180deg,#06060a 0%,#09090f 50%,#04040a 100%);
}
.bg-layer::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(139,111,255,.04) 0%, transparent 8%),
    radial-gradient(circle at 75% 70%, rgba(106,156,255,.04) 0%, transparent 8%),
    radial-gradient(circle at 50% 50%, rgba(255,122,184,.02) 0%, transparent 10%);
  background-size:100% 100%;
  animation:bgFloat 30s ease-in-out infinite alternate;
  opacity:.6;
}
@keyframes bgFloat{
  0%{transform:translate(0,0)}
  50%{transform:translate(20px,-15px)}
  100%{transform:translate(-15px,20px)}
}
/* Subtle grid texture */
.bg-layer::after{
  content:'';position:absolute;inset:0;opacity:.025;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse at center, #000 30%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at center, #000 30%, transparent 80%);
}

/* ====== Wallpaper Layer (under bg orbs/grid) ====== */
.wallpaper{
  position:fixed;inset:0;z-index:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0;transition:opacity .8s var(--ease);
  pointer-events:none;
}
.wallpaper.show{opacity:1}
/* Built-in animated wallpapers (CSS-only, GPU friendly) */
.wp-anim{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .8s var(--ease)}
.wp-anim.show{opacity:1}

/* --- Animated: Aurora --- */
.wp-aurora::before, .wp-aurora::after{
  content:'';position:absolute;inset:-20%;
  background:
    radial-gradient(60% 40% at 30% 30%, rgba(124,92,255,.55), transparent 60%),
    radial-gradient(50% 35% at 70% 60%, rgba(56,189,248,.45), transparent 60%),
    radial-gradient(45% 30% at 50% 80%, rgba(236,72,153,.35), transparent 60%);
  filter:blur(60px);
  animation:auroraFlow 22s ease-in-out infinite alternate;
}
.wp-aurora::after{
  background:
    radial-gradient(55% 35% at 70% 20%, rgba(167,139,250,.4), transparent 60%),
    radial-gradient(40% 30% at 20% 70%, rgba(34,197,94,.3), transparent 60%);
  animation-duration:28s;animation-direction:alternate-reverse;
  mix-blend-mode:screen;
}
.wp-aurora{background:radial-gradient(ellipse at center,#0a0820 0%,#04040b 80%)}
@keyframes auroraFlow{
  0%{transform:translate(0,0) rotate(0deg) scale(1)}
  50%{transform:translate(40px,-20px) rotate(8deg) scale(1.08)}
  100%{transform:translate(-30px,30px) rotate(-6deg) scale(1.04)}
}

/* --- Animated: Starfield --- */
.wp-stars{
  background:radial-gradient(ellipse at center,#080820 0%,#020208 80%);
}
.wp-stars .star-layer{
  position:absolute;inset:0;
  background-image:
    radial-gradient(1.2px 1.2px at 20% 30%, #fff, transparent 60%),
    radial-gradient(1px 1px at 80% 70%, #cfd2ff, transparent 60%),
    radial-gradient(1.4px 1.4px at 50% 50%, #fff, transparent 60%),
    radial-gradient(1px 1px at 70% 20%, #e2e8ff, transparent 60%),
    radial-gradient(1.2px 1.2px at 15% 85%, #fff, transparent 60%),
    radial-gradient(1px 1px at 35% 65%, #c9c9ff, transparent 60%),
    radial-gradient(1.4px 1.4px at 90% 40%, #fff, transparent 60%),
    radial-gradient(1px 1px at 60% 10%, #d5d8ff, transparent 60%);
  background-size:600px 600px;
  animation:starsDrift 90s linear infinite;
}
.wp-stars .star-layer.l2{
  background-size:900px 900px;
  opacity:.7;animation-duration:140s;animation-direction:reverse;
  filter:blur(.4px);
}
.wp-stars .star-layer.l3{
  background-size:1400px 1400px;
  opacity:.5;animation-duration:200s;
}
.wp-stars .twinkle{
  position:absolute;inset:0;
  background:
    radial-gradient(1.6px 1.6px at 25% 40%, #fff, transparent 60%),
    radial-gradient(1.6px 1.6px at 75% 65%, #fff, transparent 60%),
    radial-gradient(1.6px 1.6px at 45% 25%, #fff, transparent 60%);
  background-size:500px 500px;
  animation:twinkle 4s ease-in-out infinite;
  mix-blend-mode:screen;
}
@keyframes starsDrift{
  from{transform:translateY(0)}
  to{transform:translateY(-600px)}
}
@keyframes twinkle{
  0%,100%{opacity:.3}
  50%{opacity:1}
}

/* --- Animated: Nebula Pulse --- */
.wp-nebula{
  background:#04040a;
}
.wp-nebula::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(40% 30% at 30% 40%, rgba(168,85,247,.55), transparent 65%),
    radial-gradient(35% 25% at 70% 55%, rgba(59,130,246,.5), transparent 65%),
    radial-gradient(30% 20% at 50% 80%, rgba(236,72,153,.4), transparent 65%),
    radial-gradient(50% 35% at 80% 20%, rgba(14,165,233,.3), transparent 65%);
  filter:blur(40px) saturate(140%);
  animation:nebulaPulse 16s ease-in-out infinite;
}
.wp-nebula::after{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(1px 1px at 15% 25%, #fff, transparent 60%),
    radial-gradient(1px 1px at 85% 75%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 45% 55%, #fff, transparent 60%),
    radial-gradient(1px 1px at 65% 15%, #fff, transparent 60%),
    radial-gradient(1px 1px at 25% 80%, #fff, transparent 60%),
    radial-gradient(1.2px 1.2px at 95% 45%, #fff, transparent 60%);
  background-size:400px 400px;
  opacity:.6;
}
@keyframes nebulaPulse{
  0%,100%{transform:scale(1) rotate(0deg);opacity:.85}
  50%{transform:scale(1.1) rotate(3deg);opacity:1}
}

/* --- Animated: Gradient Mesh --- */
.wp-mesh{
  background:linear-gradient(135deg,#0b0a18 0%,#0a0f1f 50%,#100a18 100%);
}
.wp-mesh::before{
  content:'';position:absolute;inset:-10%;
  background:
    radial-gradient(circle at 20% 20%, rgba(124,92,255,.4), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(90,141,255,.35), transparent 40%),
    radial-gradient(circle at 60% 80%, rgba(236,72,153,.3), transparent 40%),
    radial-gradient(circle at 20% 80%, rgba(34,211,238,.3), transparent 40%);
  filter:blur(50px);
  animation:meshShift 20s ease-in-out infinite;
}
@keyframes meshShift{
  0%,100%{transform:translate(0,0)}
  33%{transform:translate(30px,-20px)}
  66%{transform:translate(-20px,25px)}
}

/* --- Animated: Cosmic Dust --- */
.wp-cosmic{
  background:radial-gradient(ellipse at 30% 40%, #1a0a2e 0%,#080418 60%,#02020a 100%);
}
.wp-cosmic::before{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(2px 2px at 25% 35%, rgba(255,255,255,.9), transparent 60%),
    radial-gradient(1px 1px at 65% 75%, rgba(167,139,250,.7), transparent 60%),
    radial-gradient(1.5px 1.5px at 45% 55%, rgba(255,255,255,.8), transparent 60%),
    radial-gradient(1px 1px at 85% 25%, rgba(96,165,250,.6), transparent 60%),
    radial-gradient(1.5px 1.5px at 15% 75%, rgba(255,255,255,.7), transparent 60%);
  background-size:300px 300px;
  animation:cosmicDrift 60s linear infinite;
}
.wp-cosmic::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(60% 50% at 40% 50%, rgba(124,92,255,.25), transparent 70%),
    radial-gradient(40% 40% at 80% 30%, rgba(56,189,248,.18), transparent 70%);
  filter:blur(30px);
  animation:nebulaPulse 24s ease-in-out infinite;
}
@keyframes cosmicDrift{
  from{background-position:0 0}
  to{background-position:300px 600px}
}

/* Reduced motion respects wallpaper animations */
body.no-anim .wp-aurora::before,
body.no-anim .wp-aurora::after,
body.no-anim .wp-nebula::before,
body.no-anim .wp-mesh::before,
body.no-anim .wp-cosmic::before,
body.no-anim .wp-cosmic::after,
body.no-anim .wp-stars .star-layer,
body.no-anim .wp-stars .twinkle{animation:none !important}

/* Wallpaper picker grid (inside Settings) */
.st-wp-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;
  padding:6px 14px 14px;
}
.st-wp-item{
  position:relative;aspect-ratio:16/10;border-radius:10px;
  cursor:pointer;overflow:hidden;
  border:2px solid transparent;
  background-size:cover;background-position:center;
  transition:transform .2s var(--ease),border-color .2s;
  box-shadow:0 4px 12px -3px rgba(0,0,0,.5);
}
.st-wp-item:hover{transform:translateY(-2px)}
.st-wp-item.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent),0 6px 18px -4px rgba(0,0,0,.6)}
.st-wp-item .wp-lbl{
  position:absolute;left:0;right:0;bottom:0;
  padding:6px 8px;font-size:11px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.75));
  text-shadow:0 1px 2px rgba(0,0,0,.7);
}
.st-wp-item .wp-badge{
  position:absolute;top:6px;right:6px;
  padding:2px 6px;font-size:9px;font-weight:700;letter-spacing:.06em;
  background:rgba(124,92,255,.85);color:#fff;border-radius:10px;
  text-transform:uppercase;
}
.st-wp-item.none{
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 6px,rgba(255,255,255,.08) 6px 12px);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;font-weight:600;
}
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
}
.bg-orb{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;
  animation:float 18s ease-in-out infinite;
}
.bg-orb.a{width:420px;height:420px;background:#7c5cff;top:-100px;left:-100px}
.bg-orb.b{width:380px;height:380px;background:#5a8dff;bottom:-120px;right:-80px;animation-delay:-9s}
.bg-orb.c{width:300px;height:300px;background:#ff5acb;top:40%;left:60%;opacity:.18;animation-delay:-4s}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(40px,-30px) scale(1.08)}
}

/* ====== Boot Splash — Cinematic Crescent+Star draw-in ====== */
#boot{
  position:fixed;inset:0;z-index:9999;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:38px;
  transition:opacity .85s cubic-bezier(.65,0,.35,1),visibility .85s;
  /* Subtle radial vignette to add depth */
  background:radial-gradient(ellipse at center, #0a0a10 0%, #000 70%);
}
#boot.hidden{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.04)}
.boot-logo{
  width:clamp(160px, 28vmin, 240px);
  height:clamp(160px, 28vmin, 240px);
  position:relative;
  filter:drop-shadow(0 0 0 rgba(255,255,255,0));
  animation:bootGlow 2.6s cubic-bezier(.4,0,.2,1) .15s forwards;
}
.boot-logo svg{width:100%;height:100%;display:block;overflow:visible}

/* Crescent moon — stroke draw-in then fill swap */
.boot-crescent-stroke{
  fill:none;
  stroke:#fff;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
  /* circumference of r=78 circle ≈ 490 */
  stroke-dasharray:495;
  stroke-dashoffset:495;
  animation:crescentDraw 1.05s cubic-bezier(.65,.02,.3,1) .25s forwards,
            crescentStrokeFade .35s ease-out 1.35s forwards;
}
.boot-crescent-fill{
  fill:#fff;
  opacity:0;
  transform-origin:center;
  transform-box:fill-box;
  animation:crescentFill .55s cubic-bezier(.4,0,.2,1) 1.20s forwards;
}

/* The 4-point sparkle star inside crescent */
.boot-star{
  fill:#fff;
  opacity:0;
  transform-origin:center;
  transform-box:fill-box;
  transform:scale(0) rotate(-45deg);
  animation:starPop .7s cubic-bezier(.34,1.56,.64,1) 1.35s forwards, starTwinkle 2.4s ease-in-out 2.1s infinite;
}

/* Subtle outer glow ring */
.boot-glow-ring{
  fill:none;
  stroke:rgba(255,255,255,.12);
  stroke-width:1;
  opacity:0;
  animation:ringFade .9s ease-out 1.4s forwards;
}

/* Particles that burst out when star pops */
.boot-particle{
  fill:#fff;
  opacity:0;
  transform-origin:center;
  transform-box:fill-box;
}
.boot-particle.p1{animation:partBurst .9s ease-out 1.5s forwards}
.boot-particle.p2{animation:partBurst .9s ease-out 1.55s forwards}
.boot-particle.p3{animation:partBurst .9s ease-out 1.6s forwards}
.boot-particle.p4{animation:partBurst .9s ease-out 1.5s forwards}
.boot-particle.p5{animation:partBurst .9s ease-out 1.58s forwards}
.boot-particle.p6{animation:partBurst .9s ease-out 1.52s forwards}

.boot-text{
  font-size:clamp(20px, 3.2vmin, 28px);font-weight:700;letter-spacing:.42em;
  background:linear-gradient(90deg,#fff,#c9b8ff,#fff);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(8px);
  animation:bootTextIn .85s cubic-bezier(.22,1,.36,1) 1.65s forwards, shimmer 3.2s linear 2.5s infinite;
  padding-left:.42em;/* compensate letter-spacing centering */
}
.boot-bar{
  width:clamp(140px, 22vmin, 200px);height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;
  opacity:0;animation:bootTextIn .7s var(--ease) 1.95s forwards;
}
.boot-bar::before{
  content:'';display:block;height:100%;width:30%;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  animation:loadBar 1.3s ease-in-out infinite;
}

@keyframes crescentDraw{
  0%  {stroke-dashoffset:495; opacity:.7}
  60% {opacity:1}
  100%{stroke-dashoffset:0;   opacity:1}
}
@keyframes crescentStrokeFade{
  0%{opacity:1}
  100%{opacity:0} /* fade outline once the fill takes over to avoid double-edge */
}
@keyframes crescentFill{
  0%  {opacity:0; transform:scale(.985)}
  100%{opacity:1; transform:scale(1)}
}
@keyframes starPop{
  0%  {opacity:0; transform:scale(0)   rotate(-45deg)}
  55% {opacity:1; transform:scale(1.25) rotate(8deg)}
  100%{opacity:1; transform:scale(1)    rotate(0deg)}
}
@keyframes starTwinkle{
  0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,.4))}
  50%   {filter:drop-shadow(0 0 14px rgba(255,255,255,.95))}
}
@keyframes ringFade{
  0%{opacity:0; transform:scale(.85)}
  100%{opacity:.55; transform:scale(1)}
}
@keyframes partBurst{
  0%  {opacity:1; transform:translate(0,0) scale(1)}
  100%{opacity:0; transform:translate(var(--px,0), var(--py,0)) scale(.2)}
}
@keyframes bootGlow{
  0%  {filter:drop-shadow(0 0 0 rgba(255,255,255,0))}
  60% {filter:drop-shadow(0 0 30px rgba(255,255,255,.55))}
  100%{filter:drop-shadow(0 0 22px rgba(255,255,255,.35))}
}
@keyframes bootTextIn{to{opacity:1; transform:translateY(0)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes loadBar{0%{transform:translateX(-100%)}100%{transform:translateX(440%)}}

/* ====== Top Menu Bar (macOS-style) ====== */
.menubar{
  position:fixed;top:0;left:0;right:0;height:32px;z-index:1000;
  background:var(--bg-glass-strong);
  backdrop-filter:blur(28px) saturate(190%);
  -webkit-backdrop-filter:blur(28px) saturate(190%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 18px;
  font-size:13px;color:var(--text-dim);
  box-shadow:0 1px 0 rgba(255,255,255,.03);
}
.menubar-left{display:flex;align-items:center;gap:18px}
.menubar-logo{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  color:#fff;
}
.menubar-logo svg{width:100%;height:100%}
.menubar-item{cursor:pointer;transition:all .2s var(--ease);padding:3px 8px;border-radius:6px;font-weight:500}
.menubar-item:hover{color:#fff;background:rgba(255,255,255,.08)}
.menubar-item.brand{color:#fff;font-weight:700;letter-spacing:.04em}
.menubar-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;font-weight:500}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok), 0 0 4px var(--ok);animation:pulseDot 2s ease-in-out infinite}
/* ====== Fullscreen Toggle Button ====== */
.mb-icon-btn{
  width:24px;height:22px;border-radius:6px;
  background:transparent;border:none;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-dim);
  cursor:pointer;
  transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  -webkit-tap-highlight-color:transparent;
  padding:0;
  position:relative;
}
.mb-icon-btn:hover{background:rgba(255,255,255,.10);color:#fff;transform:scale(1.05)}
.mb-icon-btn:active{transform:scale(.92)}
.mb-icon-btn svg{width:14px;height:14px;display:block;transition:opacity .25s var(--ease), transform .25s var(--ease)}
.mb-icon-btn .icon-exit{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none}
body.is-fullscreen .mb-icon-btn .icon-enter{opacity:0;transform:scale(.6)}
body.is-fullscreen .mb-icon-btn .icon-exit{opacity:1;transform:translate(-50%,-50%) scale(1);position:absolute;top:50%;left:50%}
.mb-icon-btn .icon-enter{transition:opacity .25s var(--ease), transform .25s var(--ease)}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.9)}}

/* ====== Desktop ====== */
.desktop{
  position:fixed;inset:30px 0 100px 0;z-index:2;
  padding:28px;
  display:grid;grid-template-columns:repeat(auto-fill,94px);grid-auto-rows:104px;gap:10px;
  align-content:start;
}
.desktop-icon{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:10px 4px;border-radius:14px;cursor:pointer;
  transition:background .25s var(--ease), transform .25s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.desktop-icon::before{
  content:'';position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid transparent;
  opacity:0;transition:opacity .25s var(--ease);
  pointer-events:none;
}
.desktop-icon:hover{transform:translateY(-2px)}
.desktop-icon:hover::before{opacity:1;border-color:rgba(255,255,255,.08)}
.desktop-icon:active{transform:translateY(0) scale(.96)}
.desktop-icon.pressed{animation:iconPress .22s var(--ease-bounce)}
@keyframes iconPress{0%{transform:scale(1)}40%{transform:scale(.88)}100%{transform:scale(1)}}
.desktop-icon .ico{
  width:52px;height:52px;border-radius:13px;overflow:hidden;
  box-shadow:0 8px 20px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), filter .25s var(--ease);
  position:relative;z-index:1;
}
.desktop-icon:hover .ico{
  transform:scale(1.08) translateY(-1px);
  box-shadow:0 14px 28px -8px rgba(0,0,0,.7), 0 0 24px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.12);
  filter:saturate(1.15);
}
.desktop-icon .lbl{
  font-size:11.5px;font-weight:500;color:#fff;letter-spacing:.01em;
  text-shadow:0 1px 4px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.5);
  text-align:center;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  position:relative;z-index:1;
  transition:color .2s;
}
.desktop-icon:hover .lbl{color:#fff}

/* ====== Windows ====== */
.window{
  position:absolute;z-index:10;
  background:var(--bg-glass-strong);
  backdrop-filter:blur(36px) saturate(190%);
  -webkit-backdrop-filter:blur(36px) saturate(190%);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-xl);
  display:flex;flex-direction:column;
  min-width:380px;min-height:260px;
  overflow:hidden;
  transform-origin:center;
  animation:winIn .42s var(--ease-bounce);
}
.window.focused{
  box-shadow:0 50px 120px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06), 0 0 80px -12px rgba(139,111,255,.18);
}
@keyframes winIn{from{opacity:0;transform:scale(.92) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.window.minimized{animation:winMin .35s var(--ease) forwards;pointer-events:none}
@keyframes winMin{to{opacity:0;transform:scale(.4) translateY(420px)}}
.window.maximized{border-radius:0;border:none}
.window-titlebar{
  height:40px;display:flex;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
  border-bottom:1px solid var(--border);
  padding:0 14px;gap:10px;
  cursor:grab;flex-shrink:0;
  position:relative;
}
.window-titlebar::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
  pointer-events:none;
}
.window-titlebar:active{cursor:grabbing}
.win-title{
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;color:var(--text);
  flex:1;pointer-events:none;
}
.win-title .ti{width:16px;height:16px;border-radius:4px;overflow:hidden}
/* Win11 controls (right side) */
.win-controls{display:flex;align-items:center;gap:0;margin-left:auto}
.win-btn{
  width:46px;height:34px;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);transition:background .2s var(--ease),color .2s,transform .15s;border-radius:7px;
  margin:0 1px;
}
.win-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.win-btn:active{transform:scale(.92)}
.win-btn.close:hover{background:linear-gradient(180deg,#ff5a6a,#e81123);color:#fff;box-shadow:0 2px 8px rgba(232,17,35,.4)}
.win-btn svg{width:11px;height:11px;transition:transform .2s var(--ease)}
.win-btn:hover svg{transform:scale(1.1)}
.window-body{
  flex:1;background:#0e0e13;overflow:hidden;position:relative;
}
.window-body iframe{
  width:100%;height:100%;border:none;background:#fff;
}
.window.resizing{transition:none}
.resize-handle{
  position:absolute;width:14px;height:14px;right:0;bottom:0;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.15) 50%);
  z-index:5;
}

/* ====== Dock (macOS-style with magnification) ====== */
.dock-wrap{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  z-index:500;
  transition:transform .4s var(--ease), opacity .4s var(--ease);
}
/* Auto-hide when any app window is open */
body.has-open-window .dock-wrap{
  transform:translateX(-50%) translateY(140px);
  opacity:0;
  pointer-events:none;
}
/* Hover reveal zone at bottom edge */
.dock-hover-zone{
  position:fixed;left:0;right:0;bottom:0;height:14px;z-index:499;
  pointer-events:auto;
}
body.has-open-window .dock-hover-zone:hover ~ .dock-wrap,
body.has-open-window .dock-wrap:hover{
  transform:translateX(-50%) translateY(0);
  opacity:1;
  pointer-events:auto;
}
/* Manual force-show (used by Cmd/Ctrl+D toggle) */
body.dock-pinned .dock-wrap{
  transform:translateX(-50%) translateY(0) !important;
  opacity:1 !important;
  pointer-events:auto !important;
}
.dock{
  display:flex;align-items:flex-end;gap:8px;
  padding:9px 14px;
  background:var(--bg-glass-strong);
  backdrop-filter:blur(32px) saturate(190%);
  -webkit-backdrop-filter:blur(32px) saturate(190%);
  border:1px solid var(--border-strong);
  border-radius:22px;
  box-shadow:var(--shadow-xl), inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.3);
  position:relative;
}
.dock::before{
  content:'';position:absolute;inset:0;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%);
  pointer-events:none;
}
.dock-item{
  position:relative;
  width:54px;height:54px;border-radius:14px;
  overflow:visible;cursor:pointer;
  transition:transform .35s var(--ease-bounce), filter .25s var(--ease);
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.dock-item .icon-inner{
  width:100%;height:100%;border-radius:14px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px -6px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.2);
  transition:transform .35s var(--ease-bounce), box-shadow .25s var(--ease), filter .25s var(--ease);
  position:relative;
}
.dock-item .icon-inner::after{
  content:'';position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 50%);
  pointer-events:none;opacity:.6;
}
.dock-item:hover{transform:translateY(-10px) scale(1.05)}
.dock-item:hover .icon-inner{
  transform:scale(1.18);
  box-shadow:0 18px 36px -10px rgba(0,0,0,.85), 0 0 32px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.18);
  filter:saturate(1.2) brightness(1.05);
}
/* Neighbor magnification effect */
.dock-item:hover + .dock-item,
.dock-item:has(+ .dock-item:hover){transform:translateY(-4px) scale(1.02)}
.dock-item:active{transform:translateY(-6px) scale(.98)}
.dock-item:active .icon-inner{transform:scale(1.08)}
.dock-item .tip{
  position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(6px);
  padding:6px 12px;font-size:12px;font-weight:600;letter-spacing:.01em;
  background:rgba(8,8,14,.95);color:#fff;border-radius:8px;
  border:1px solid var(--border-strong);
  white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .25s var(--ease), transform .25s var(--ease);
  box-shadow:0 8px 20px -4px rgba(0,0,0,.6);
  backdrop-filter:blur(12px);
}
.dock-item .tip::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:rgba(8,8,14,.95);
}
.dock-item:hover .tip{opacity:1;transform:translateX(-50%) translateY(0);transition-delay:.15s}
.dock-item .indicator{
  position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;
  background:linear-gradient(135deg,#fff,#c9b8ff);
  opacity:0;transition:opacity .25s var(--ease), width .25s var(--ease);
  box-shadow:0 0 8px rgba(255,255,255,.6);
}
.dock-item.running .indicator{opacity:.95}
.dock-item.running:hover .indicator{width:14px;border-radius:3px}
.dock-divider{width:1px;height:38px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.12),transparent);margin:0 4px;align-self:center}

/* ====== App icons ====== */
.icon-inner svg, .ico svg, .ti svg{width:100%;height:100%;display:block}

/* ====== Context Menu ====== */
.ctx-menu{
  position:fixed;z-index:9000;
  min-width:220px;
  background:var(--bg-glass-ultra);
  backdrop-filter:blur(32px) saturate(190%);
  -webkit-backdrop-filter:blur(32px) saturate(190%);
  border:1px solid var(--border-strong);
  border-radius:12px;
  box-shadow:var(--shadow-xl), inset 0 1px 0 rgba(255,255,255,.06);
  padding:6px;
  font-size:13px;
  animation:ctxIn .18s var(--ease-bounce);
  transform-origin:top left;
}
@keyframes ctxIn{from{opacity:0;transform:scale(.92) translateY(-4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.ctx-item{
  padding:9px 14px;border-radius:7px;cursor:pointer;
  display:flex;align-items:center;gap:10px;color:var(--text);
  transition:background .15s var(--ease), color .15s, transform .15s;
  font-weight:500;
}
.ctx-item:hover{background:linear-gradient(90deg,var(--accent-soft),transparent);color:#fff;transform:translateX(2px)}
.ctx-item.danger:hover{background:linear-gradient(90deg,rgba(255,90,106,.2),transparent);color:#ffb3b9}
.ctx-divider{height:1px;background:var(--border);margin:5px 4px}

/* ====== Scrollbar ====== */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:5px;border:2px solid transparent;background-clip:padding-box;transition:background .2s}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}

/* ====== Selection ====== */
::selection{background:var(--accent-soft);color:#fff;text-shadow:0 0 8px var(--accent-glow)}

/* ====== Focus Ring (a11y) ====== */
button:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;
}

/* ====== Notification ====== */
.notify{
  position:fixed;top:46px;right:16px;z-index:7000;
  display:flex;flex-direction:column;gap:10px;pointer-events:none;
}
.notify-item{
  background:var(--bg-glass-ultra);
  backdrop-filter:blur(28px) saturate(190%);
  -webkit-backdrop-filter:blur(28px) saturate(190%);
  border:1px solid var(--border-strong);
  padding:12px 16px;border-radius:12px;font-size:13px;color:#fff;font-weight:500;
  box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.06);
  animation:notifyIn .42s var(--ease-bounce);
  pointer-events:auto;
  display:flex;align-items:center;gap:12px;
  min-width:260px;
  position:relative;overflow:hidden;
}
.notify-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
}
@keyframes notifyIn{from{opacity:0;transform:translateX(60px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}
.notify-item.fadeout{animation:notifyOut .35s var(--ease) forwards}
@keyframes notifyOut{to{opacity:0;transform:translateX(60px) scale(.95)}}

/* No window message */
.welcome{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;color:var(--text-mute);font-size:14px;
  z-index:1;pointer-events:none;
}
.welcome h1{
  font-size:56px;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff 20%,#8b6fff 60%,#6a9cff 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:14px;
  animation:welcomeShimmer 6s ease-in-out infinite;
  filter:drop-shadow(0 4px 30px rgba(139,111,255,.3));
}
@keyframes welcomeShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.welcome p{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--text-mute)}

/* =====================================================
   App Store (native, refined design)
   ===================================================== */
.appstore{
  display:flex;width:100%;height:100%;
  background:linear-gradient(180deg,#0c0c12 0%, #08080d 100%);
  color:var(--text);
  font-family:'Inter','SF Pro Display','Segoe UI',-apple-system,sans-serif;
}
.as-sidebar{
  width:220px;flex-shrink:0;
  padding:22px 14px;
  border-right:1px solid var(--border);
  background:rgba(255,255,255,.015);
  overflow-y:auto;
}
.as-side-title{
  font-size:11px;font-weight:600;color:var(--text-mute);
  text-transform:uppercase;letter-spacing:.12em;
  padding:0 10px 8px;
}
.as-cat{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;
  font-size:13.5px;font-weight:500;color:var(--text-dim);
  cursor:pointer;margin-bottom:2px;
  transition:background .15s,color .15s;
}
.as-cat:hover{background:rgba(255,255,255,.04);color:#fff}
.as-cat.active{
  background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(90,141,255,.14));
  color:#fff;
  box-shadow:inset 0 0 0 1px rgba(124,92,255,.3);
}
.as-cat .ci{
  width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);font-size:13px;
}
.as-cat.active .ci{background:rgba(124,92,255,.3)}

.as-main{
  flex:1;overflow-y:auto;padding:24px 28px 40px;
}
.as-header{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:22px;flex-wrap:wrap;gap:14px;
}
.as-title{
  font-size:32px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#fff 30%,#a78bff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.as-subtitle{font-size:13px;color:var(--text-mute);margin-top:4px}
.as-search{
  position:relative;
}
.as-search input{
  width:260px;padding:9px 14px 9px 34px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  border-radius:8px;color:#fff;font-size:13px;font-family:inherit;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.as-search input:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,255,.15);
  background:rgba(255,255,255,.08);
}
.as-search svg{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--text-mute);pointer-events:none;
}

/* Featured banner */
.as-feature{
  margin-bottom:26px;
  border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg,#1d1530 0%,#0d1a2e 100%);
  border:1px solid var(--border);
  display:flex;align-items:center;gap:24px;
  padding:22px 26px;position:relative;
}
.as-feature::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 80% 20%, rgba(124,92,255,.22), transparent 60%);
  pointer-events:none;
}
.as-feature .ftxt{flex:1;z-index:1;position:relative}
.as-feature .ftag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:#c5b3ff;
  background:rgba(124,92,255,.18);padding:4px 10px;border-radius:30px;
  margin-bottom:10px;
}
.as-feature .ftitle{font-size:22px;font-weight:800;margin-bottom:6px}
.as-feature .fdesc{font-size:13px;color:var(--text-dim);line-height:1.55;max-width:480px}
.as-feature .ficon{
  width:96px;height:96px;border-radius:22px;overflow:hidden;flex-shrink:0;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.5);
  z-index:1;position:relative;
}

.as-section-title{
  font-size:18px;font-weight:700;margin:6px 0 14px;
  display:flex;align-items:center;gap:8px;
}
.as-section-title .count{
  font-size:12px;font-weight:500;color:var(--text-mute);
  background:rgba(255,255,255,.05);padding:2px 8px;border-radius:30px;
}

.as-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;
}
.as-card{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  display:flex;gap:12px;align-items:center;
  cursor:pointer;
  transition:background .2s,border-color .2s,transform .2s;
}
.as-card:hover{
  background:rgba(255,255,255,.06);
  border-color:var(--border-strong);
  transform:translateY(-2px);
}
.as-card .cicon{
  width:56px;height:56px;border-radius:14px;overflow:hidden;flex-shrink:0;
  box-shadow:0 4px 12px -2px rgba(0,0,0,.4);
}
.as-card .cinfo{flex:1;min-width:0}
.as-card .cname{font-size:14px;font-weight:700;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-card .ccat{font-size:11.5px;color:var(--text-mute);margin-bottom:6px}
.as-card .cdesc{font-size:12px;color:var(--text-dim);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.as-card .cbtn{
  flex-shrink:0;align-self:flex-start;
  padding:6px 14px;border-radius:30px;
  font-size:12px;font-weight:700;
  background:rgba(255,255,255,.1);color:#fff;
  border:1px solid var(--border);
  transition:all .15s;
}
.as-card .cbtn:hover{background:var(--accent);border-color:var(--accent)}
.as-card .cbtn.installed{
  background:transparent;color:var(--text-mute);
  border-color:transparent;cursor:default;
}
.as-card .cbtn.installed:hover{background:transparent;border-color:transparent}

/* App detail overlay */
.as-detail-mask{
  position:absolute;inset:0;z-index:50;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:30px;
  animation:winIn .25s var(--ease);
}
.as-detail{
  width:100%;max-width:640px;max-height:100%;
  background:linear-gradient(180deg,#15151c 0%,#0c0c12 100%);
  border:1px solid var(--border-strong);
  border-radius:18px;
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-xl);
}
.as-detail-head{
  padding:24px;display:flex;gap:18px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.as-detail-head .dicon{
  width:96px;height:96px;border-radius:22px;overflow:hidden;flex-shrink:0;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.6);
}
.as-detail-head .dinfo{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center}
.as-detail-head .dname{font-size:22px;font-weight:800;color:#fff}
.as-detail-head .dcat{font-size:12.5px;color:var(--text-mute);font-weight:500}
.as-detail-head .dbtns{display:flex;gap:8px;margin-top:8px}
.as-detail-head .dbtn{
  padding:8px 18px;border-radius:30px;
  font-size:12.5px;font-weight:700;
  border:1px solid transparent;
  transition:all .15s;
}
.as-detail-head .dbtn.primary{
  background:var(--accent);color:#fff;
  box-shadow:0 4px 14px -2px rgba(124,92,255,.4);
}
.as-detail-head .dbtn.primary:hover{background:#8e72ff;transform:translateY(-1px)}
.as-detail-head .dbtn.secondary{
  background:rgba(255,255,255,.08);color:#fff;border-color:var(--border);
}
.as-detail-head .dbtn.secondary:hover{background:rgba(255,255,255,.14)}
.as-detail-head .dbtn.installed{
  background:rgba(52,211,153,.15);color:#34d399;border-color:rgba(52,211,153,.3);
  cursor:default;
}
.as-detail-head .dclose{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);color:var(--text-dim);
  transition:all .15s;
}
.as-detail-head .dclose:hover{background:rgba(255,255,255,.14);color:#fff}
.as-detail-body{
  padding:20px 24px 24px;overflow-y:auto;flex:1;
}
.as-detail-body h4{font-size:13px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.as-detail-body p{font-size:13.5px;line-height:1.65;color:var(--text);margin-bottom:18px}
.as-detail-meta{

/* =====================================================
   Fullscreen mode (window borderless)
   ===================================================== */
body.fullscreen-mode .window.focused.maximized{
  border-radius:0;border:none;
  top:0 !important;height:100vh !important;
}
body.fullscreen-mode .window.focused.maximized .window-titlebar{
  background:rgba(0,0,0,.4);
}

/* =====================================================
   Reduced-motion (Performance mode)
   ===================================================== */
body.no-anim *, body.no-anim *::before, body.no-anim *::after{
  animation-duration:.001s !important;
  transition-duration:.001s !important;
}
body.no-anim .bg-orb{animation:none !important}

/* =====================================================
   Compact mode (smaller icons)
   ===================================================== */
body.compact .desktop{grid-template-columns:repeat(auto-fill,72px);grid-auto-rows:84px}
body.compact .desktop-icon .ico{width:40px;height:40px}
body.compact .desktop-icon .lbl{font-size:10.5px}
body.compact .dock-item{width:46px;height:46px}

/* =====================================================
   Faux fullscreen fallback (for iOS Safari etc.)
   ===================================================== */
body.faux-fullscreen .menubar{transform:translateY(-100%);transition:transform .35s var(--ease)}
body.faux-fullscreen .dock-wrap{transform:translateY(120%);transition:transform .35s var(--ease)}
body.faux-fullscreen .desktop{inset:0 0 0 0}
body.faux-fullscreen .window.focused.maximized{top:0 !important;height:100vh !important;height:100dvh !important}

/* =====================================================
   RESPONSIVE — Tablet / Phone / Touch optimizations
   =====================================================
   Strategy:
     - Use dvh/svh for true viewport on iOS Safari
     - Touch-friendly hit targets (≥44px)
     - Reflow desktop grid to fit any width
     - Dock pinned at bottom on small screens
     - Windows auto-maximize on phones (no awkward floating)
     - Larger font-scale on hi-dpi tablets
     - Safe-area insets for notched devices
   ===================================================== */

/* iOS dynamic viewport */
@supports (height: 100dvh){
  html, body{height:100dvh}
}

/* Safe-area insets for iPhone notch / home indicator */
.menubar{padding-top:env(safe-area-inset-top); height:calc(32px + env(safe-area-inset-top))}
.dock-wrap{padding-bottom:env(safe-area-inset-bottom)}
.desktop{padding-left:max(28px, env(safe-area-inset-left)); padding-right:max(28px, env(safe-area-inset-right))}

/* Tablet (≤ 1024px) */
@media (max-width: 1024px){
  .desktop{grid-template-columns:repeat(auto-fill, 84px); grid-auto-rows:96px; padding:22px; gap:8px}
  .desktop-icon .ico{width:48px;height:48px}
  .desktop-icon .lbl{font-size:11px}
  .dock{padding:8px 10px; gap:8px}
  .dock-item{width:50px;height:50px}
  .window{min-width:320px; min-height:240px}
  .welcome h1{font-size:clamp(40px, 8vw, 64px)}
}

/* Phone (≤ 720px) — the big one */
@media (max-width: 720px){
  :root{
    --radius-xl:18px;
    --radius-lg:14px;
  }
  .menubar{font-size:12px; padding:0 12px; padding-top:env(safe-area-inset-top)}
  .menubar-left{gap:10px}
  .menubar-right{gap:10px}
  .menubar-item.brand{font-size:13px}
  #bat, #clk{font-size:11.5px}

  .desktop{
    grid-template-columns:repeat(auto-fill, minmax(74px, 1fr));
    grid-auto-rows:92px;
    padding:18px 14px;
    gap:6px;
    inset:calc(32px + env(safe-area-inset-top)) 0 110px 0;
  }
  .desktop-icon{padding:8px 2px}
  .desktop-icon .ico{width:44px;height:44px;border-radius:11px}
  .desktop-icon .lbl{font-size:10.5px;max-width:72px}

  /* Dock pinned + horizontally scrollable on phone */
  .dock-hover-zone{display:none}
  .dock-wrap{
    bottom:max(12px, env(safe-area-inset-bottom));
    left:8px; right:8px;
    transform:none !important;
    opacity:1 !important;
    pointer-events:auto !important;
  }
  .dock{
    width:auto; max-width:100%;
    padding:6px 8px; gap:6px;
    overflow-x:auto; overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    border-radius:18px;
    justify-content:flex-start;
  }
  .dock::-webkit-scrollbar{display:none}
  .dock-item{width:44px;height:44px;flex-shrink:0}
  /* Disable magnification scaling on touch (no hover) */
  .dock-item:hover{transform:none}

  /* Windows: auto-maximize feel on phones, but keep titlebar */
  .window{
    min-width:0 !important;
    min-height:0 !important;
    width:calc(100vw - 12px) !important;
    max-width:calc(100vw - 12px);
    left:6px !important;
    right:6px;
    top:calc(36px + env(safe-area-inset-top)) !important;
    height:calc(100vh - 120px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important;
    height:calc(100dvh - 120px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important;
    border-radius:var(--radius-lg);
  }
  .window.maximized{
    top:calc(32px + env(safe-area-inset-top)) !important;
    left:0 !important;
    width:100vw !important;
    height:calc(100dvh - 32px - env(safe-area-inset-top)) !important;
  }
  .window-titlebar{height:42px; padding:0 10px}
  .win-btn{width:24px;height:24px}
  .resize-handle{display:none} /* no manual resize on phone */

  .welcome{padding:0 16px}
  .welcome h1{font-size:clamp(36px, 12vw, 56px)}
  .welcome p{font-size:13px}

  .notify{left:8px;right:8px;bottom:auto;top:calc(40px + env(safe-area-inset-top));max-width:none}
}

/* Very small phones (≤ 380px) */
@media (max-width: 380px){
  .desktop{grid-template-columns:repeat(auto-fill, minmax(68px, 1fr));grid-auto-rows:86px}
  .desktop-icon .ico{width:40px;height:40px}
  .desktop-icon .lbl{font-size:10px;max-width:66px}
  .dock-item{width:40px;height:40px}
  #bat{display:none}
}

/* Touch devices — disable hover-driven magnification & enlarge hit areas */
@media (hover: none) and (pointer: coarse){
  .desktop-icon:hover{transform:none}
  .desktop-icon:hover .ico{transform:none; filter:none}
  .dock-item:hover{transform:none}
  .win-btn{width:28px;height:28px}
  .mb-icon-btn{width:32px;height:28px}
  .mb-icon-btn svg{width:16px;height:16px}
  /* Prevent text selection on long-press for UI chrome */
  .menubar, .dock, .window-titlebar, .desktop-icon, .dock-item{
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
}

/* Landscape phone — keep dock compact */
@media (max-width: 900px) and (orientation: landscape) and (max-height: 500px){
  .desktop{inset:32px 0 80px 0; grid-auto-rows:80px}
  .desktop-icon .ico{width:42px;height:42px}
  .dock-wrap{bottom:6px}
  .dock{padding:5px 7px}
  .dock-item{width:40px;height:40px}
  .welcome h1{font-size:36px}
  .welcome p{font-size:12px}
}

/* Hi-DPI screens — crisper shadows */
@media (min-resolution: 2dppx){
  .window{box-shadow:0 50px 120px -32px rgba(0,0,0,.9), 0 0 0 .5px rgba(255,255,255,.06)}
}

/* Reduced motion accessibility */
@media (prefers-reduced-motion: reduce){
  .boot-crescent-stroke, .boot-crescent-fill, .boot-star, .boot-glow-ring, .boot-particle, .boot-logo, .boot-text, .boot-bar{
    animation-duration:.001s !important; animation-delay:0s !important;
    opacity:1 !important; transform:none !important; stroke-dashoffset:0 !important;
  }
  *, *::before, *::after{
    animation-duration:.001s !important;
    animation-iteration-count:1 !important;
    transition-duration:.001s !important;
  }
}

/* Window dragging visual hint */
.window.dragging{
  transition:none !important;
  cursor:grabbing;
  box-shadow:0 60px 140px -28px rgba(0,0,0,.95), 0 0 0 1px rgba(139,111,255,.18), 0 0 80px -10px rgba(139,111,255,.28);
}
.window.dragging .window-titlebar{cursor:grabbing}
.window-titlebar{cursor:grab; touch-action:none}
.window.maximized .window-titlebar{cursor:default}

/* =========================================================
   Render icon helper — SVG / URL / emoji / fallback letter
   ========================================================= */
function renderIcon(app){
  const ic = app.icon;
  const c = app.color || '#7c5cff';
  const letter = (app.name || '?').trim()[0].toUpperCase();
  const letterFallback = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#fff;background:linear-gradient(135deg,${c},${shade(c,-30)});border-radius:inherit;font-family:'Inter','SF Pro Display',sans-serif">${letter}</div>`;
  if(!ic) return letterFallback;
  // Built-in SVG icon name
  if(typeof ic === 'string' && ICONS[ic]) return ICONS[ic];
  // External image URL (http/https/data:)
  if(typeof ic === 'string' && /^(https?:|data:)/.test(ic)){
    const safe = String(ic).replace(/"/g,'&quot;');
    // Background as colored fallback in case image fails
    return `<div style="width:100%;height:100%;background:linear-gradient(135deg,${c},${shade(c,-30)});border-radius:inherit;overflow:hidden;display:flex;align-items:center;justify-content:center">`
         + `<img src="${safe}" alt="${escapeHtml(app.name||'')}" `
         + `style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block" `
         + `onerror="this.outerHTML='<div style=&quot;color:#fff;font-weight:800;font-size:26px&quot;>${letter}</div>'"/>`
         + `</div>`;
  }
  // Emoji / single-char fallback
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,${c},${shade(c,-30)});border-radius:inherit">${ic}</div>`;
}

function shade(hex, percent){
  // simple hex shading
  const f = parseInt(hex.slice(1),16);
  const t = percent<0?0:255, p = Math.abs(percent)/100;
  const R = f>>16, G = (f>>8)&0x00FF, B = f&0x0000FF;
  return "#"+(0x1000000 + (Math.round((t-R)*p)+R)*0x10000 + (Math.round((t-G)*p)+G)*0x100 + (Math.round((t-B)*p)+B)).toString(16).slice(1);
}

/* =========================================================
   Storage — Home apps (which apps are pinned to desktop/dock)
   ========================================================= */
const HOME_KEY = 'nyxos.home.v2';
const DEFAULT_HOME = ['youtube','browser','app','games','appstore','chatgpt'];

function loadHome(){
  try{
    const s = localStorage.getItem(HOME_KEY);
    if(s) return JSON.parse(s);
  }catch{}
  return DEFAULT_HOME.slice();
}
function saveHome(arr){
  try{ localStorage.setItem(HOME_KEY, JSON.stringify(arr)); }catch{}
}
let HOME_APPS = loadHome();

function getApp(id){ return APP_CATALOG.find(a=>a.id===id); }
function isInstalled(id){ return HOME_APPS.includes(id); }
function installApp(id){
  if(!HOME_APPS.includes(id)){
    HOME_APPS.push(id);
    saveHome(HOME_APPS);
    buildDesktop(); buildDock();
    return true;
  }
  return false;
}
function uninstallApp(id){
  const app = getApp(id);
  if(app?.locked) return false;
  HOME_APPS = HOME_APPS.filter(x=>x!==id);
  saveHome(HOME_APPS);
  buildDesktop(); buildDock();
  return true;
}

/* =========================================================
   Window Manager
   ========================================================= */
const WM = {
  windows:[],
  zTop:10,
  byApp:new Map(),

  open(app){
    // single-instance: focus if exists
    if(this.byApp.has(app.id)){
      const w = this.byApp.get(app.id);
      w.classList.remove('minimized');
      this.focus(w);
      return;
    }
    const w = document.createElement('div');
    w.className = 'window';
    const W = app.width || 980, H = app.height || 640;
    const x = Math.max(20, Math.round((window.innerWidth - W) / 2 + (Math.random()*60-30)));
    const y = Math.max(40, Math.round((window.innerHeight - H) / 2 - 30 + (Math.random()*40-20)));
    w.style.cssText = `left:${x}px;top:${y}px;width:${W}px;height:${H}px;`;
    w.dataset.appId = app.id;

    // Body: internal apps or iframe
    let bodyHTML;
    if(app.url === '__store__' || app.url === '__settings__' || app.url === '__nyxos__'){
      bodyHTML = `<div class="window-body" id="appRoot_${app.id}"></div>`;
    }else{
      bodyHTML = `
        <div class="window-body">
          <iframe src="${app.url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-presentation" allow="autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media"></iframe>
        </div>
      `;
    }

    w.innerHTML = `
      <div class="window-titlebar">
        <div class="win-title"><div class="ti">${renderIcon(app)}</div><span>${app.name}</span></div>
        <div class="win-controls">
          <button class="win-btn min" title="Minimize"><svg viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.2"/></svg></button>
          <button class="win-btn max" title="Maximize"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
          <button class="win-btn close" title="Close"><svg viewBox="0 0 12 12"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5" stroke="currentColor" stroke-width="1.4"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5" stroke="currentColor" stroke-width="1.4"/></svg></button>
        </div>
      </div>
      ${bodyHTML}
      <div class="resize-handle"></div>
    `;
    document.body.appendChild(w);
    this.windows.push(w);
    this.byApp.set(app.id, w);
    this.focus(w);
    this._wireWindow(w, app);
    document.querySelector('.welcome')?.style.setProperty('opacity','0');
    this._updateDockIndicators();
    this._updateDockVisibility();

    // Mount internal apps
    const root = w.querySelector(`#appRoot_${app.id}`);
    if(app.url === '__store__'){
      mountAppStore(root);
    } else if(app.url === '__settings__'){
      mountSettings(root);
    } else if(app.url === '__nyxos__'){
      mountNyxApp(root);
    }
  },

  _wireWindow(w, app){
    const tbar = w.querySelector('.window-titlebar');
    const minBtn = w.querySelector('.win-btn.min');
    const maxBtn = w.querySelector('.win-btn.max');
    const closeBtn = w.querySelector('.win-btn.close');
    const resize = w.querySelector('.resize-handle');

    /* =========================================================
       DRAG — robust pointer-events implementation
       =========================================================
       Fixes:
         1) Window no longer "follows the cursor" when user isn't
            actually grabbing the titlebar (drag only starts when
            pointerdown lands directly on the titlebar background
            or its text — NEVER on buttons, iframes, child controls).
         2) Uses setPointerCapture so the pointerup event is
            guaranteed to fire even if the cursor leaves the
            titlebar or enters an iframe — prior code could get
            stuck in "dragging" mode.
         3) Move/up listeners are added on pointerdown and removed
            on pointerup — no permanently-attached global listeners.
         4) A small movement threshold (3px) prevents accidental
            "drag jitter" from a normal click.
         5) Full touch support (pointer events unify mouse + touch).
    */
    let dragState = null;
    const onTbarPointerDown = (e)=>{
      // Only primary button / single touch
      if(e.button !== undefined && e.button !== 0) return;
      // Never drag from interactive children
      if(e.target.closest('.win-btn, button, input, select, a, [data-no-drag]')) return;
      // The pointerdown target must be the titlebar itself or its label,
      // i.e. the user is actually grabbing the titlebar "frame".
      if(!(e.target === tbar || tbar.contains(e.target))) return;
      if(w.classList.contains('maximized')) return;
      // Capture so we never lose the pointerup
      try{ tbar.setPointerCapture(e.pointerId); }catch(_){}
      dragState = {
        id:e.pointerId,
        startX:e.clientX, startY:e.clientY,
        startL:w.offsetLeft, startT:w.offsetTop,
        moved:false
      };
      this.focus(w);
    };
    const onTbarPointerMove = (e)=>{
      if(!dragState || e.pointerId !== dragState.id) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      // Threshold prevents micro-jitter on a plain click
      if(!dragState.moved){
        if(Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
        dragState.moved = true;
        document.body.style.userSelect='none';
        w.classList.add('dragging');
        // Disable pointer events on iframes while dragging so move events
        // don't get "swallowed" when cursor passes over them.
        w.querySelectorAll('iframe').forEach(f=> f.style.pointerEvents='none');
      }
      const newL = dragState.startL + dx;
      const newT = Math.max(30, dragState.startT + dy);
      // Keep at least 40px of titlebar visible on the right/bottom edges
      const maxL = window.innerWidth  - 80;
      const maxT = window.innerHeight - 60;
      w.style.left = Math.min(Math.max(-w.offsetWidth + 80, newL), maxL) + 'px';
      w.style.top  = Math.min(newT, maxT) + 'px';
    };
    const onTbarPointerUp = (e)=>{
      if(!dragState || e.pointerId !== dragState.id) return;
      try{ tbar.releasePointerCapture(e.pointerId); }catch(_){}
      if(dragState.moved){
        document.body.style.userSelect='';
        w.classList.remove('dragging');
        w.querySelectorAll('iframe').forEach(f=> f.style.pointerEvents='');
      }
      dragState = null;
    };
    tbar.addEventListener('pointerdown', onTbarPointerDown);
    tbar.addEventListener('pointermove', onTbarPointerMove);
    tbar.addEventListener('pointerup', onTbarPointerUp);
    tbar.addEventListener('pointercancel', onTbarPointerUp);
    // Safety net if browser steals the pointer (e.g. context menu)
    tbar.addEventListener('lostpointercapture', onTbarPointerUp);

    // Focus
    w.addEventListener('mousedown', ()=> this.focus(w));
    w.addEventListener('touchstart', ()=> this.focus(w), {passive:true});

    /* =========================================================
       RESIZE — same robust pointer-events pattern
       ========================================================= */
    let resizeState = null;
    resize.addEventListener('pointerdown', e=>{
      if(e.button !== undefined && e.button !== 0) return;
      e.stopPropagation();
      try{ resize.setPointerCapture(e.pointerId); }catch(_){}
      resizeState = {
        id:e.pointerId,
        startX:e.clientX, startY:e.clientY,
        startW:w.offsetWidth, startH:w.offsetHeight
      };
      w.classList.add('resizing');
      document.body.style.userSelect='none';
      w.querySelectorAll('iframe').forEach(f=> f.style.pointerEvents='none');
    });
    resize.addEventListener('pointermove', e=>{
      if(!resizeState || e.pointerId !== resizeState.id) return;
      w.style.width = Math.max(320, resizeState.startW + e.clientX - resizeState.startX) + 'px';
      w.style.height= Math.max(240, resizeState.startH + e.clientY - resizeState.startY) + 'px';
    });
    const endResize = (e)=>{
      if(!resizeState || (e && e.pointerId !== resizeState.id)) return;
      try{ resize.releasePointerCapture(e.pointerId); }catch(_){}
      resizeState = null;
      w.classList.remove('resizing');
      document.body.style.userSelect='';
      w.querySelectorAll('iframe').forEach(f=> f.style.pointerEvents='');
    };
    resize.addEventListener('pointerup', endResize);
    resize.addEventListener('pointercancel', endResize);
    resize.addEventListener('lostpointercapture', endResize);

    // Buttons
    minBtn.addEventListener('click', ()=> this.minimize(w));
    maxBtn.addEventListener('click', ()=> this.toggleMax(w));
    closeBtn.addEventListener('click', ()=> this.close(w));

    // Double click titlebar = max toggle
    tbar.addEventListener('dblclick', e=>{
      if(e.target.closest('.win-btn')) return;
      this.toggleMax(w);
    });
  },

  focus(w){
    this.zTop++;
    w.style.zIndex = this.zTop;
    this.windows.forEach(x=>x.classList.remove('focused'));
    w.classList.add('focused');
    if(w.classList.contains('minimized')){
      w.classList.remove('minimized');
      this._updateDockIndicators();
      this._updateDockVisibility();
    }
  },

  minimize(w){
    w.classList.add('minimized');
    this._updateDockIndicators();
  },

  toggleMax(w){
    if(w.classList.contains('maximized')){
      w.classList.remove('maximized');
      const s = w.dataset.prev ? JSON.parse(w.dataset.prev) : {};
      Object.assign(w.style, s);
    }else{
      w.dataset.prev = JSON.stringify({left:w.style.left, top:w.style.top, width:w.style.width, height:w.style.height});
      // 完全に画面下まで広がる最大化（Dockはauto-hideで隠れる）
      Object.assign(w.style, {left:'0px', top:'30px', width:'100vw', height:'calc(100vh - 30px)'});
      w.classList.add('maximized');
      this._updateDockVisibility();
    }
  },

  close(w){
    const id = w.dataset.appId;
    w.style.animation = 'winMin .25s var(--ease) forwards';
    setTimeout(()=>{
      w.remove();
      this.windows = this.windows.filter(x=>x!==w);
      this.byApp.delete(id);
      this._updateDockIndicators();
      this._updateDockVisibility();
      if(this.windows.length===0) document.querySelector('.welcome')?.style.setProperty('opacity','1');
    }, 240);
  },

  _updateDockIndicators(){
    document.querySelectorAll('.dock-item').forEach(item=>{
      const aid = item.dataset.appId;
      const has = this.byApp.has(aid) && !this.byApp.get(aid).classList.contains('minimized');
      const hasMin = this.byApp.has(aid);
      item.classList.toggle('running', hasMin);
    });
  },

  /* Determine if any window is currently visible (not minimized) -> hide dock */
  _updateDockVisibility(){
    if(!SETTINGS.dockAutoHide){
      document.body.classList.remove('has-open-window');
      return;
    }
    const anyVisible = this.windows.some(w=>!w.classList.contains('minimized'));
    document.body.classList.toggle('has-open-window', anyVisible);
  }
};

/* Patch minimize to update dock visibility (keep original behavior) */
WM.minimize = function(w){
  w.classList.add('minimized');
  this._updateDockIndicators();
  this._updateDockVisibility();
};

/* =========================================================
   Build Desktop & Dock from HOME_APPS
   ========================================================= */
function buildDesktop(){
  const d = document.getElementById('desktop');
  d.innerHTML='';
  HOME_APPS.forEach(id=>{
    const app = getApp(id); if(!app) return;
    const el = document.createElement('div');
    el.className='desktop-icon';
    el.innerHTML = `<div class="ico">${renderIcon(app)}</div><div class="lbl">${app.name}</div>`;
    // Single click to open (with subtle press animation)
    el.addEventListener('click', (e)=>{
      if(e.detail > 1) return; // ignore rapid repeats
      el.classList.add('pressed');
      setTimeout(()=> el.classList.remove('pressed'), 220);
      WM.open(app);
    });
    el.addEventListener('contextmenu', e=>{ e.preventDefault(); showCtxMenu(e.clientX, e.clientY, app); });
    d.appendChild(el);
  });
}

function buildDock(){
  const dock = document.getElementById('dock');
  dock.innerHTML='';
  // 「Finder」の代わりに設定アプリをドックの先頭に配置
  const pinned = [getApp('settings'), getApp('nyxos')].filter(Boolean);
  const homeItems = HOME_APPS
    .map(id=>getApp(id))
    .filter(a => a && !pinned.find(p=>p.id===a.id));
  const items = [...pinned, ...homeItems];

  items.forEach((app,i)=>{
    const el = document.createElement('div');
    el.className='dock-item';
    el.dataset.appId = app.id;
    el.innerHTML = `
      <div class="icon-inner">${renderIcon(app)}</div>
      <div class="tip">${app.name}</div>
      <div class="indicator"></div>
    `;
    el.addEventListener('click', ()=>{
      const existing = WM.byApp.get(app.id);
      if(existing){
        if(existing.classList.contains('minimized')){
          existing.classList.remove('minimized');
        }
        WM.focus(existing);
        WM._updateDockIndicators();
        WM._updateDockVisibility();
      }else{
        WM.open(app);
      }
    });
    el.addEventListener('contextmenu', e=>{ e.preventDefault(); showCtxMenu(e.clientX,e.clientY,app); });
    dock.appendChild(el);
    // pinnedとhomeItemsの境界にdivider
    if(i === pinned.length - 1 && homeItems.length > 0){
      const div = document.createElement('div'); div.className='dock-divider'; dock.appendChild(div);
    }
  });
}

/* =========================================================
   Context Menu
   ========================================================= */
function showCtxMenu(x,y,app){
  closeCtxMenu();
  const m = document.createElement('div');
  m.className='ctx-menu';
  m.id='ctxMenu';
  m.style.left = x+'px';
  m.style.top  = y+'px';
  const removable = isInstalled(app.id) && !app.locked;
  m.innerHTML = `
    <div class="ctx-item" data-act="open">📂 ${app.name} を開く</div>
    <div class="ctx-item" data-act="info">ℹ️ アプリ情報</div>
    ${removable ? `<div class="ctx-divider"></div><div class="ctx-item danger" data-act="remove">🗑 ホーム画面から削除</div>`:''}
  `;
  document.body.appendChild(m);
  m.querySelectorAll('.ctx-item').forEach(it=>{
    it.addEventListener('click', ()=>{
      const act = it.dataset.act;
      if(act==='open') WM.open(app);
      else if(act==='info'){
        // open AppStore and show this app
        const storeApp = getApp('appstore');
        WM.open(storeApp);
        setTimeout(()=> showAppDetail(app.id), 100);
      }
      else if(act==='remove'){
        if(uninstallApp(app.id)) notify(`${app.name} をホーム画面から削除しました`);
      }
      closeCtxMenu();
    });
  });

  // viewport clamp
  const rect = m.getBoundingClientRect();
  if(rect.right > window.innerWidth)  m.style.left = (window.innerWidth - rect.width - 8)+'px';
  if(rect.bottom> window.innerHeight) m.style.top  = (window.innerHeight- rect.height- 8)+'px';
}
function closeCtxMenu(){ document.getElementById('ctxMenu')?.remove(); }
document.addEventListener('click', closeCtxMenu);

/* =========================================================
   Notifications
   ========================================================= */
function notify(text){
  const n = document.createElement('div');
  n.className='notify-item';
  n.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)"></span><span>${text}</span>`;
  document.getElementById('notify').appendChild(n);
  setTimeout(()=>n.classList.add('fadeout'), 2400);
  setTimeout(()=>n.remove(), 2800);
}

/* =========================================================
   App Store — native implementation
   ========================================================= */
const STORE_CATEGORIES = [
  {id:'all',     name:'すべて',           icon:'🌐'},
  {id:'featured',name:'おすすめ',          icon:'⭐'},
  {id:'エンタメ', name:'エンタメ',         icon:'🎬'},
  {id:'ゲーム',   name:'ゲーム',           icon:'🎮'},
  {id:'プロキシ', name:'プロキシ',         icon:'🛡️'},
  {id:'ツール',   name:'ツール',           icon:'🧰'},
  {id:'コミュニケーション', name:'コミュニケーション', icon:'💬'},
  {id:'AI',      name:'AI',               icon:'🤖'},
  {id:'開発',     name:'開発',             icon:'💻'},
  {id:'学習',     name:'学習',             icon:'📚'},
  {id:'情報',     name:'情報',             icon:'📰'},
  {id:'システム', name:'システム',         icon:'⚙️'},
];

let _storeState = { activeCat:'featured', query:'', activeRoot:null };

function mountAppStore(root){
  if(!root) return;
  _storeState.activeRoot = root;

  root.innerHTML = `
    <div class="appstore">
      <aside class="as-sidebar">
        <div class="as-side-title">カテゴリ</div>
        <div id="asCats"></div>
      </aside>
      <main class="as-main">
        <div class="as-header">
          <div>
            <div class="as-title">App Store</div>
            <div class="as-subtitle">NyxOS で使える全てのアプリを発見しよう</div>
          </div>
          <div class="as-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="asSearch" type="text" placeholder="アプリを検索..." />
          </div>
        </div>
        <div id="asContent"></div>
      </main>
    </div>
  `;

  // Cats
  const catsEl = root.querySelector('#asCats');
  STORE_CATEGORIES.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'as-cat' + (c.id === _storeState.activeCat ? ' active' : '');
    el.innerHTML = `<div class="ci">${c.icon}</div><div>${c.name}</div>`;
    el.addEventListener('click', ()=>{
      _storeState.activeCat = c.id;
      catsEl.querySelectorAll('.as-cat').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      renderStoreContent();
    });
    catsEl.appendChild(el);
  });

  // Search
  root.querySelector('#asSearch').addEventListener('input', e=>{
    _storeState.query = e.target.value.trim().toLowerCase();
    renderStoreContent();
  });

  renderStoreContent();
}

function renderStoreContent(){
  const root = _storeState.activeRoot;
  if(!root) return;
  const content = root.querySelector('#asContent');
  const cat = _storeState.activeCat;
  const q = _storeState.query;

  // Filter
  let apps = APP_CATALOG.filter(a=>!a.locked || a.id==='appstore' ? true : true);
  // (we DO want appstore visible)
  if(cat === 'featured'){
    apps = apps.filter(a => ['nyxos','youtube','browser','app','games','chatgpt','helios','minecraft','code','anime'].includes(a.id));
  } else if(cat !== 'all'){
    apps = apps.filter(a => a.category === cat);
  }
  if(q){
    apps = apps.filter(a =>
      a.name.toLowerCase().includes(q) ||
      (a.desc||'').toLowerCase().includes(q) ||
      (a.category||'').toLowerCase().includes(q) ||
      (a.tags||[]).some(t=>t.toLowerCase().includes(q))
    );
  }

  let html = '';

  // Featured banner (only when on featured/all, no search)
  if((cat === 'featured' || cat === 'all') && !q){
    const feat = getApp('nyxos') || getApp('chatgpt');
    html += `
      <div class="as-feature" data-feat="${feat.id}">
        <div class="ftxt">
          <div class="ftag">注目のアプリ</div>
          <div class="ftitle">${feat.name} — この OS についてもっと知ろう</div>
          <div class="fdesc">${feat.desc}</div>
        </div>
        <div class="ficon">${renderIcon(feat)}</div>
      </div>
    `;
  }

  // Section title
  const catName = STORE_CATEGORIES.find(c=>c.id===cat)?.name || 'アプリ';
  html += `<div class="as-section-title">${q?`「${escapeHtml(q)}」の検索結果`:catName}<span class="count">${apps.length}</span></div>`;

  if(apps.length === 0){
    html += `<div class="as-empty"><div class="ee">🔍</div><div class="et">該当するアプリが見つかりませんでした</div></div>`;
  } else {
    html += `<div class="as-grid">`;
    apps.forEach(a=>{
      const installed = isInstalled(a.id);
      html += `
        <div class="as-card" data-app="${a.id}">
          <div class="cicon">${renderIcon(a)}</div>
          <div class="cinfo">
            <div class="cname">${a.name}</div>
            <div class="ccat">${a.category}</div>
            <div class="cdesc">${a.desc}</div>
          </div>
          <button class="cbtn ${installed?'installed':''}" data-install="${a.id}">
            ${installed ? '追加済み' : '+ 追加'}
          </button>
        </div>
      `;
    });
    html += `</div>`;
  }

  content.innerHTML = html;

  // Wire feature banner
  content.querySelector('.as-feature')?.addEventListener('click', ()=>{
    showAppDetail(content.querySelector('.as-feature').dataset.feat);
  });

  // Wire cards
  content.querySelectorAll('.as-card').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('button[data-install]')) return;
      showAppDetail(card.dataset.app);
    });
  });
  content.querySelectorAll('button[data-install]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const id = btn.dataset.install;
      if(isInstalled(id)){
        notify('既にホーム画面に追加されています');
      }else{
        installApp(id);
        notify(`✓ ${getApp(id).name} をホーム画面に追加しました`);
        btn.classList.add('installed');
        btn.textContent = '追加済み';
      }
    });
  });
}

function showAppDetail(id){
  const root = _storeState.activeRoot;
  if(!root) return;
  const app = getApp(id);
  if(!app) return;

  // Remove existing
  root.querySelector('.as-detail-mask')?.remove();

  const installed = isInstalled(id);

  const mask = document.createElement('div');
  mask.className = 'as-detail-mask';
  mask.innerHTML = `
    <div class="as-detail" onclick="event.stopPropagation()">
      <div class="as-detail-head">
        <div class="dicon">${renderIcon(app)}</div>
        <div class="dinfo">
          <div class="dname">${app.name}</div>
          <div class="dcat">${app.category} · v${app.version||'1.0.0'}</div>
          <div class="dbtns">
            ${installed
              ? `<button class="dbtn installed">✓ ホーム画面に追加済み</button>`
              : `<button class="dbtn primary" data-act="install">+ ホーム画面に追加</button>`
            }
            <button class="dbtn secondary" data-act="open">開く</button>
          </div>
        </div>
        <button class="dclose" data-act="close" title="Close">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <div class="as-detail-body">
        <h4>説明</h4>
        <p>${app.longDesc || app.desc}</p>
        <div class="as-detail-meta">
          <div class="mi"><div class="mlbl">カテゴリ</div><div class="mval">${app.category}</div></div>
          <div class="mi"><div class="mlbl">バージョン</div><div class="mval">${app.version||'1.0.0'}</div></div>
          <div class="mi"><div class="mlbl">提供元</div><div class="mval">${app.author||'NyxOS'}</div></div>
          <div class="mi"><div class="mlbl">エンドポイント</div><div class="mval">${app.url==='__store__'?'(内蔵)':app.url}</div></div>
        </div>
      </div>
    </div>
  `;

  // Append to store root (so it's contained in the window)
  root.querySelector('.appstore').appendChild(mask);

  mask.addEventListener('click', ()=> mask.remove());

  mask.querySelector('[data-act="close"]').addEventListener('click', ()=> mask.remove());
  mask.querySelector('[data-act="open"]').addEventListener('click', ()=>{
    WM.open(app);
    mask.remove();
  });
  const installBtn = mask.querySelector('[data-act="install"]');
  installBtn?.addEventListener('click', ()=>{
    if(installApp(id)){
      notify(`✓ ${app.name} をホーム画面に追加しました`);
      // refresh detail
      showAppDetail(id);
      renderStoreContent();
    }
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

/* =========================================================
   SETTINGS — user preferences & persistence
   ========================================================= */
const SETTINGS_KEY = 'nyxos.settings.v1';
const DEFAULT_SETTINGS = {
  accent:'#7c5cff',
  theme:'dark',           // 'dark' | 'midnight' | 'graphite'
  dockAutoHide:true,      // ウィンドウが1つでも開いていたら Dock を隠す
  fullscreenMode:false,   // ウィンドウ最大化時に全画面化
  reduceMotion:false,     // アニメーションを拑える
  compactMode:false,      // アイコンを小さく
  bootAnim:true,          // 次回起動時にブートアニメを表示
  showWelcome:true,       // デスクトップ中央の NyxOS ウェルカムテキスト
  brightness:100,         // 表示明さ 50〜100
  username:'Guest',
  wallpaper:'default',    // 壁紙ID (default または WALLPAPERS のid)
};
let SETTINGS = loadSettings();
function loadSettings(){
  try{
    const s = localStorage.getItem(SETTINGS_KEY);
    if(s) return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(s));
  }catch{}
  return Object.assign({}, DEFAULT_SETTINGS);
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); }catch{}
}

/* Hex helpers for accent shading */
function hexToRgba(hex, a){
  const f = parseInt(hex.slice(1),16);
  const R=f>>16, G=(f>>8)&0xFF, B=f&0xFF;
  return `rgba(${R},${G},${B},${a})`;
}

function applyWallpaper(){
  const id = SETTINGS.wallpaper || 'default';
  const imgEl  = document.getElementById('wallpaperImg');
  const animEl = document.getElementById('wallpaperAnim');
  const bg     = document.getElementById('bgLayer');
  if(!imgEl || !animEl || !bg) return;

  // リセット
  imgEl.className  = 'wallpaper';
  animEl.className = 'wp-anim';
  imgEl.style.backgroundImage = '';
  animEl.innerHTML = '';

  if(id === 'default' || !id){
    // デフォルト：bg-layer だけ表示
    bg.style.opacity = '1';
    return;
  }

  const w = WALLPAPERS.find(x => x.id === id);
  if(!w){ bg.style.opacity = '1'; return; }

  if(w.type === 'image'){
    imgEl.style.backgroundImage = `url("${w.url}")`;
    requestAnimationFrame(()=> imgEl.classList.add('show'));
    bg.style.opacity = '.35'; // 画像の上に規則グリッドを薄く乗せる
  } else {
    // アニメーション壁紙
    animEl.classList.add(w.cls);
    if(w.cls === 'wp-stars'){
      animEl.innerHTML = `
        <div class="star-layer"></div>
        <div class="star-layer l2"></div>
        <div class="star-layer l3"></div>
        <div class="twinkle"></div>`;
    }
    requestAnimationFrame(()=> animEl.classList.add('show'));
    bg.style.opacity = '.45';
  }
}

/* Apply all settings to DOM */
function applySettings(){
  const r = document.documentElement;
  r.style.setProperty('--accent', SETTINGS.accent);
  r.style.setProperty('--accent-2', shade(SETTINGS.accent, -20));
  r.style.setProperty('--accent-glow', hexToRgba(SETTINGS.accent, .45));
  // Theme background tweaks
  const themes = {
    dark:      {bg0:'#0a0a0c', bg1:'#101014', bg2:'#16161c'},
    midnight:  {bg0:'#06060f', bg1:'#0a0a18', bg2:'#10101e'},
    graphite:  {bg0:'#101012', bg1:'#16161a', bg2:'#1c1c20'},
  };
  const t = themes[SETTINGS.theme] || themes.dark;
  r.style.setProperty('--bg-0', t.bg0);
  r.style.setProperty('--bg-1', t.bg1);
  r.style.setProperty('--bg-2', t.bg2);
  document.body.style.filter = `brightness(${SETTINGS.brightness}%)`;

  document.body.classList.toggle('no-anim', !!SETTINGS.reduceMotion);
  document.body.classList.toggle('compact', !!SETTINGS.compactMode);
  document.body.classList.toggle('fullscreen-mode', !!SETTINGS.fullscreenMode);
  // Welcome
  const wel = document.querySelector('.welcome');
  if(wel) wel.style.display = SETTINGS.showWelcome ? '' : 'none';
  // Dock visibility re-evaluation
  if(window.WM && WM._updateDockVisibility) WM._updateDockVisibility();
  // Wallpaper
  applyWallpaper();
}
